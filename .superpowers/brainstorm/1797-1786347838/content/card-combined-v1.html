<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<title>Card Combined</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0c0e14;
    color: #d0d8e8;
    font-family: -apple-system, 'PingFang SC', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  h1 { font-size: 1.1rem; color: #6080a0; letter-spacing: 0.14em; font-weight: 400; margin-bottom: 6px; }
  .sub { font-size: 0.78rem; color: #3a4a60; margin-bottom: 60px; }

  /* ── main stage ── */
  .stage {
    position: relative;
    width: 900px;
    height: 380px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  /* ── info panel (right side) ── */
  .info-panel {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 210px;
    background: rgba(16, 22, 40, 0.97);
    border: 1px solid #2a3a5a;
    border-radius: 14px;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }
  .info-panel.visible { opacity: 1; }

  .info-panel .state-tag {
    font-size: 0.65rem; letter-spacing: 0.14em; color: #5080a0;
    text-transform: uppercase; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .info-panel .state-tag::before {
    content: '';
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: currentColor;
  }
  .info-panel .song-name {
    font-size: 1rem; color: #c8daf0; margin-bottom: 8px; font-weight: 500;
  }
  .info-panel .song-desc {
    font-size: 0.76rem; color: #5a7090; line-height: 1.65; margin-bottom: 18px;
  }
  .info-panel .btn-enter {
    display: block; width: 100%;
    background: #243860; border: none; color: #80b8f0;
    border-radius: 8px; padding: 9px; font-size: 0.78rem;
    cursor: pointer; margin-bottom: 8px;
    transition: background 0.2s;
  }
  .info-panel .btn-enter:hover { background: #2e4878; }
  .info-panel .btn-next {
    display: block; width: 100%;
    background: transparent; border: 1px solid #243040;
    color: #4a6080; border-radius: 8px; padding: 8px;
    font-size: 0.76rem; cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .info-panel .btn-next:hover { border-color: #3a5070; color: #6080a0; }

  /* ── cards ── */
  .cards-wrap {
    position: relative;
    /* centered, leaves room for info panel on right */
    width: 560px;
    height: 340px;
    margin-right: 50px;
  }

  .card {
    position: absolute;
    width: 118px;
    height: 180px;
    border-radius: 12px;
    cursor: pointer;
    /* transform-origin set to bottom-center for arc feel */
    transform-origin: 50% 110%;
    /* transition has a tiny delay so rapid in/out doesn't flicker */
    transition: transform 0.38s cubic-bezier(.22,.68,0,1.25),
                box-shadow 0.3s ease,
                z-index 0s 0.38s;
    box-shadow: 0 6px 24px rgba(0,0,0,0.55);
    /* individual resting transforms set by JS */
  }

  .card .cover {
    width: 100%; height: 100%;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    padding: 12px;
  }
  .card .cover::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.1) 55%, transparent 100%);
    border-radius: 12px;
  }
  .card .title {
    position: relative; z-index: 1;
    font-size: 0.68rem; color: #ccdaf5; letter-spacing: 0.06em;
    line-height: 1.3;
  }
  .card .state-badge {
    position: relative; z-index: 1;
    font-size: 0.58rem; color: #7090c0; letter-spacing: 0.1em;
    text-transform: uppercase; margin-bottom: 3px;
  }

  /* hover: lift upward, straighten slightly, glow */
  .card:hover {
    /* override via JS — but fallback here */
    box-shadow: 0 20px 50px rgba(0,0,0,0.75), 0 0 32px rgba(80,140,240,0.18);
    z-index: 20;
    transition: transform 0.38s cubic-bezier(.22,.68,0,1.25),
                box-shadow 0.3s ease,
                z-index 0s 0s;
  }

  .hint {
    margin-top: 50px;
    font-size: 0.72rem;
    color: #2a3a50;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<h1>Sound States</h1>
<p class="sub">鼠标悬停任意封面</p>

<div class="stage">
  <div class="cards-wrap" id="cardsWrap"></div>
  <div class="info-panel" id="infoPanel">
    <div class="state-tag" id="infoState"></div>
    <div class="song-name"  id="infoName"></div>
    <div class="song-desc"  id="infoDesc"></div>
    <button class="btn-enter">▶ 进入聆听</button>
    <button class="btn-next">下一张 →</button>
  </div>
</div>

<p class="hint">悬停 · 右侧出现简介 · 点击进入或继续浏览</p>

<script>
const SONGS = [
  { name: 'Dawn Scene',         desc: 'A gradual emotional rise with soft hope and open space.',        state: 'Cinematic', grad: ['#2a3d5c','#b98a5a'] },
  { name: 'Lonely City',        desc: 'Urban night atmosphere, distance and quiet isolation.',           state: 'Cinematic', grad: ['#1c2333','#4a5a7a'] },
  { name: 'Slow Memory',        desc: 'Nostalgic cinematic texture with a suspended feeling.',           state: 'Cinematic', grad: ['#3a2c44','#7a6a8a'] },
  { name: 'Imagined Landscape', desc: 'A wider layered world for emotional projection.',                 state: 'Cinematic', grad: ['#22323a','#8aa0a0'] },
  { name: 'Phonk Drive',        desc: 'Heavy pulse, distorted texture and forward momentum.',            state: 'Motion',    grad: ['#1a0c12','#7a2030'] },
  { name: 'Trap Energy',        desc: 'Sharper beat structure with strong low-end presence.',            state: 'Motion',    grad: ['#0e0c1a','#5a2a7a'] },
  { name: 'Ritual Pulse',       desc: 'Hypnotic percussive loop with circular tension.',                 state: 'Motion',    grad: ['#160a1a','#7a3a6a'] },
];

/* ── layout: arc fan + scattered tilt ──
   Cards sit in a gentle arc (rotate around bottom-center origin),
   PLUS a small random extra tilt so they feel naturally tossed, not robotic.
   Spacing is wide enough that hover zones don't overlap.
*/
const N = SONGS.length;
const SPREAD_DEG = 52;          // total arc spread in degrees
const BASE_ROT = [];            // resting rotation for each card
const EXTRA_TILT = [-4, 2, -2, 3, -3, 1, -5]; // extra organic tilt per card
const LIFT_PX = 52;             // how far card rises on hover

for (let i = 0; i < N; i++) {
  const t = N === 1 ? 0 : (i / (N - 1) - 0.5);
  BASE_ROT[i] = t * SPREAD_DEG + EXTRA_TILT[i];
}

/* horizontal offset so arc looks centered in the wrap */
const wrap = document.getElementById('cardsWrap');
const panel = document.getElementById('infoPanel');
let hoverTimer = null;

SONGS.forEach((s, i) => {
  const card = document.createElement('div');
  card.className = 'card';

  /* position: spread cards evenly horizontally, all anchored near bottom */
  const xFrac = N === 1 ? 0.5 : i / (N - 1);
  const leftPx = xFrac * 430 + 14;   // 14px margin, 430px total spread
  const bottomPx = 10;
  card.style.left   = leftPx + 'px';
  card.style.bottom = bottomPx + 'px';
  card.style.transform = `rotate(${BASE_ROT[i]}deg)`;
  card.style.zIndex = i + 1;

  card.innerHTML = `
    <div class="cover" style="background:linear-gradient(150deg,${s.grad[0]},${s.grad[1]})">
      <div class="state-badge">${s.state}</div>
      <div class="title">${s.name}</div>
    </div>`;

  /* hover: lift card upward, reduce tilt toward 0, show info */
  card.addEventListener('mouseenter', () => {
    clearTimeout(hoverTimer);
    /* lift + straighten: keep bottom anchor, add upward translate */
    card.style.transform = `rotate(${BASE_ROT[i] * 0.15}deg) translateY(-${LIFT_PX}px)`;
    card.style.zIndex = 20;

    document.getElementById('infoState').textContent = s.state;
    document.getElementById('infoName').textContent  = s.name;
    document.getElementById('infoDesc').textContent  = s.desc;
    panel.classList.add('visible');
  });

  card.addEventListener('mouseleave', () => {
    /* tiny delay before resetting — kills the flicker from overlapping hitboxes */
    hoverTimer = setTimeout(() => {
      card.style.transform = `rotate(${BASE_ROT[i]}deg)`;
      card.style.zIndex = i + 1;
    }, 60);
    /* keep info panel a moment longer so it feels smooth */
    setTimeout(() => panel.classList.remove('visible'), 120);
  });

  wrap.appendChild(card);
});
</script>
</body>
</html>
