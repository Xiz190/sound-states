<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<title>Loose 3D + Daily Tarot</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #090b12;
  color: #d0d8e8;
  font-family: -apple-system, 'PingFang SC', sans-serif;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 32px 0 60px;
  overflow-x: hidden;
}
h1 { font-size: 1.05rem; color: #5a7898; letter-spacing: .15em; font-weight: 400; margin-bottom: 4px; }
.sub { font-size: .74rem; color: #304050; margin-bottom: 24px; }

.toggle-row { display:flex; gap:10px; margin-bottom:36px; }
.tog { background:#101820; border:1px solid #283848; color:#486080; border-radius:20px; padding:6px 18px; font-size:.76rem; cursor:pointer; transition:all .18s; }
.tog.active { background:#1a3050; color:#78a8d8; border-color:#344a66; }

/* ═══════════════════════════
   DESKTOP — loose 3D helix
═══════════════════════════ */
#desktopView { display:flex; flex-direction:column; align-items:center; width:100%; }

.scene-wrap {
  position: relative;
  width: 900px; height: 460px;
  display: flex; align-items: center; justify-content: center;
}
.scene {
  perspective: 1000px;
  perspective-origin: 50% 44%;
  width: 340px; height: 340px;
  position: relative;
}
.helix {
  width:100%; height:100%;
  transform-style: preserve-3d;
  transform: rotateX(-14deg) rotateY(0deg);
  position: relative;
  cursor: grab;
}
.helix:active { cursor: grabbing; }

.hcard {
  position: absolute;
  width: 96px; height: 144px;
  top:50%; left:50%;
  margin-top:-72px; margin-left:-48px;
  border-radius: 11px; cursor: pointer;
  transform-style: preserve-3d;
  transition: filter .22s;
  will-change: transform;
}
.hcard-inner {
  width:100%; height:100%; border-radius:11px; overflow:hidden;
  display:flex; flex-direction:column; justify-content:flex-end; padding:9px;
  box-shadow: 0 8px 32px rgba(0,0,0,.7);
  position: relative;
}
.hcard-inner::after {
  content:''; position:absolute; inset:0;
  background: linear-gradient(to top, rgba(0,0,0,.8) 0%, transparent 55%);
  border-radius:11px;
}
.hcard .badge { position:relative;z-index:1;font-size:.5rem;color:#507090;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px; }
.hcard .title { position:relative;z-index:1;font-size:.62rem;color:#c0d4f0;line-height:1.25; }

.h-info {
  position:absolute; right:18px; top:50%;
  transform: translateY(-50%);
  width:190px;
  background:rgba(10,16,28,.97);
  border:1px solid #1e3040; border-radius:14px; padding:18px;
  opacity:0; transition:opacity .18s; pointer-events:none; z-index:100;
}
.h-info.visible { opacity:1; }
.h-state { font-size:.6rem;letter-spacing:.14em;color:#3d6880;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin-bottom:8px; }
.h-state::before { content:'';width:5px;height:5px;border-radius:50%;background:#3d6880;flex-shrink:0; }
.h-name { font-size:.92rem;color:#b8d0ec;font-weight:500;margin-bottom:6px; }
.h-desc { font-size:.71rem;color:#486070;line-height:1.65;margin-bottom:14px; }
.h-enter { display:block;width:100%;background:#182e4e;border:none;color:#60a0d8;border-radius:8px;padding:8px;font-size:.73rem;cursor:pointer;margin-bottom:7px;transition:background .18s; }
.h-enter:hover { background:#203a60; }
.h-next { display:block;width:100%;background:transparent;border:1px solid #1c2c3c;color:#365870;border-radius:8px;padding:7px;font-size:.71rem;cursor:pointer; }

.d-controls { display:flex;align-items:center;gap:18px;margin-top:18px; }
.ctrl-btn { background:#101820;border:1px solid #283848;color:#4a6888;border-radius:8px;padding:7px 16px;font-size:.75rem;cursor:pointer;transition:all .18s; }
.ctrl-btn:hover { background:#182840;color:#6888a8; }
.ctrl-lbl { font-size:.68rem;color:#243040;letter-spacing:.08em; }
.view-label { font-size:.68rem;color:#263040;letter-spacing:.08em;margin-top:12px; }

/* ═══════════════════════════
   MOBILE — Daily Tarot Draw
═══════════════════════════ */
#mobileView { display:none; flex-direction:column; align-items:center; }

.phone-frame {
  width:340px; height:660px;
  border:2px solid #223040; border-radius:38px;
  background:#090b12; position:relative; overflow:hidden;
  box-shadow: 0 20px 64px rgba(0,0,0,.85);
}
.phone-notch {
  width:96px; height:20px; background:#090b12;
  border-radius:0 0 12px 12px; margin:0 auto;
  border-left:2px solid #223040; border-right:2px solid #223040; border-bottom:2px solid #223040;
  position:relative;z-index:10;
}

/* ── SCREEN A: mood picker ── */
#screenMood {
  position:absolute; inset:0; padding:14px 22px 28px;
  display:flex; flex-direction:column;
}
.daily-eyebrow {
  font-size:.58rem; color:#304858; letter-spacing:.18em; text-transform:uppercase; margin-bottom:4px; text-align:center; margin-top:4px;
}
.daily-date {
  font-size:.78rem; color:#4a6880; text-align:center; margin-bottom:20px; letter-spacing:.06em;
}
.daily-q {
  font-size:.85rem; color:#8aaccc; text-align:center; margin-bottom:20px; line-height:1.5; letter-spacing:.04em;
}
.mood-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:22px;
}
.mood-btn {
  background:#0f1824; border:1px solid #1e2e40;
  border-radius:12px; padding:13px 10px;
  cursor:pointer; text-align:center;
  transition:all .2s; position:relative; overflow:hidden;
}
.mood-btn:hover, .mood-btn.sel {
  border-color:#2e4860; background:#141e30;
}
.mood-btn.sel::after {
  content:''; position:absolute; inset:0;
  border:1px solid #3a6080; border-radius:12px;
  animation: pulseBorder 1.5s ease-in-out infinite;
}
@keyframes pulseBorder {
  0%,100% { opacity:.6; } 50% { opacity:1; }
}
.mood-icon { font-size:1.4rem; margin-bottom:5px; }
.mood-lbl  { font-size:.65rem; color:#5a7898; letter-spacing:.08em; }

.draw-btn {
  width:100%; background:linear-gradient(135deg, #1a3050, #223868);
  border:1px solid #2e4868; color:#80b8f0; border-radius:14px;
  padding:14px; font-size:.82rem; cursor:pointer; letter-spacing:.06em;
  transition:all .22s;
  box-shadow: 0 4px 20px rgba(30,60,100,.3);
}
.draw-btn:hover { background:linear-gradient(135deg,#223868,#2a4278); box-shadow:0 6px 28px rgba(40,80,140,.4); }

/* ── SCREEN B: tarot reveal ── */
#screenReveal {
  position:absolute; inset:0;
  display:none; flex-direction:column; align-items:center;
  padding:16px 22px 24px;
}
.rev-eyebrow { font-size:.56rem; color:#304858; letter-spacing:.18em; text-transform:uppercase; margin-bottom:2px; margin-top:4px; }
.rev-subtitle { font-size:.68rem; color:#3a5870; margin-bottom:16px; letter-spacing:.05em; }

/* cards revealed in a loose fan */
.reveal-fan {
  position:relative; width:260px; height:220px;
  margin-bottom:14px; flex-shrink:0;
}
.r-card {
  position:absolute;
  width:100px; height:154px;
  border-radius:12px; cursor:pointer;
  transform-origin:50% 110%;
  transition: transform .35s cubic-bezier(.22,.68,0,1.28), box-shadow .25s;
  box-shadow: 0 8px 28px rgba(0,0,0,.7);
}
/* the 3 revealed cards in a mini fan — flipped to show cover */
.r-card .r-cover {
  width:100%; height:100%; border-radius:12px; overflow:hidden;
  position:relative; display:flex; flex-direction:column;
  justify-content:flex-end; padding:9px;
}
.r-card .r-cover::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.78) 0%,transparent 55%);
  border-radius:12px;
}
.r-card .r-badge { position:relative;z-index:1;font-size:.5rem;color:#5880a0;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px; }
.r-card .r-name  { position:relative;z-index:1;font-size:.6rem;color:#c8d8f0;line-height:1.2; }
.r-card:hover {
  transform-origin:50% 110%;
  box-shadow: 0 14px 40px rgba(0,0,0,.85), 0 0 22px rgba(60,120,210,.2);
  z-index:10;
}
/* fan positions */
.r-card:nth-child(1) { left:10px;  bottom:0; transform:rotate(-18deg); }
.r-card:nth-child(2) { left:80px;  bottom:0; transform:rotate(0deg); z-index:5; }
.r-card:nth-child(3) { left:150px; bottom:0; transform:rotate(18deg); }
.r-card:nth-child(1):hover { transform:rotate(-18deg) translateY(-20px) scale(1.07) !important; }
.r-card:nth-child(2):hover { transform:rotate(0deg)   translateY(-20px) scale(1.07) !important; }
.r-card:nth-child(3):hover { transform:rotate(18deg)  translateY(-20px) scale(1.07) !important; }

/* today's fortune text */
.fortune-box {
  background:#0d1624; border:1px solid #1c2c3e; border-radius:12px;
  padding:14px 16px; margin-bottom:14px; width:100%;
}
.fortune-label { font-size:.55rem; color:#2e4858; letter-spacing:.16em; text-transform:uppercase; margin-bottom:6px; }
.fortune-text  { font-size:.72rem; color:#5a7898; line-height:1.65; }

.rev-enter {
  display:block; width:100%;
  background:linear-gradient(135deg,#1a3050,#223868);
  border:1px solid #2e4868; color:#70a8e0; border-radius:14px;
  padding:13px; font-size:.78rem; cursor:pointer; letter-spacing:.05em;
  margin-bottom:9px;
}
.rev-back {
  display:block; width:100%; background:transparent;
  border:1px solid #182838; color:#304858; border-radius:12px;
  padding:9px; font-size:.7rem; cursor:pointer;
}
</style>
</head>
<body>
<h1>Sound States</h1>
<p class="sub">桌面端松散 3D · 移动端今日音乐塔罗</p>
<div class="toggle-row">
  <button class="tog active" onclick="showView('desktop',this)">🖥 桌面端 — 松散旋转楼梯</button>
  <button class="tog"        onclick="showView('mobile', this)">🃏 移动端 — 今日音乐运势</button>
</div>

<!-- ══════════ DESKTOP ══════════ -->
<div id="desktopView">
  <div class="scene-wrap">
    <div class="scene">
      <div class="helix" id="helix"></div>
    </div>
    <div class="h-info" id="hInfo">
      <div class="h-state" id="hSt"></div>
      <div class="h-name"  id="hNm"></div>
      <div class="h-desc"  id="hDs"></div>
      <button class="h-enter">▶ 进入聆听</button>
      <button class="h-next">下一张 →</button>
    </div>
  </div>
  <div class="d-controls">
    <button class="ctrl-btn" onclick="spinDir(-1)">◀</button>
    <span class="ctrl-lbl">拖拽旋转楼梯</span>
    <button class="ctrl-btn" onclick="spinDir(1)">▶</button>
  </div>
  <p class="view-label">卡间距更大 · 螺旋更松散 · 悬停突出</p>
</div>

<!-- ══════════ MOBILE ══════════ -->
<div id="mobileView">
  <div class="phone-frame">
    <div class="phone-notch"></div>

    <!-- Screen A: mood picker -->
    <div id="screenMood">
      <div class="daily-eyebrow">Sound States</div>
      <div class="daily-date" id="todayDate"></div>
      <div class="daily-q">今天，你的状态是？</div>
      <div class="mood-grid">
        <div class="mood-btn" data-mood="relax"     onclick="pickMood(this)"><div class="mood-icon">🌙</div><div class="mood-lbl">想放松</div></div>
        <div class="mood-btn" data-mood="focus"     onclick="pickMood(this)"><div class="mood-icon">🔮</div><div class="mood-lbl">需要专注</div></div>
        <div class="mood-btn" data-mood="cinematic" onclick="pickMood(this)"><div class="mood-icon">✨</div><div class="mood-lbl">想感受氛围</div></div>
        <div class="mood-btn" data-mood="motion"    onclick="pickMood(this)"><div class="mood-icon">⚡</div><div class="mood-lbl">要动起来</div></div>
      </div>
      <button class="draw-btn" onclick="doDraw()">☽ 今日抽牌</button>
    </div>

    <!-- Screen B: reveal -->
    <div id="screenReveal">
      <div class="rev-eyebrow">今日推荐</div>
      <div class="rev-subtitle" id="revSub">为你抽出 3 首</div>
      <div class="reveal-fan" id="revFan"></div>
      <div class="fortune-box">
        <div class="fortune-label">今日频率</div>
        <div class="fortune-text" id="fortuneText"></div>
      </div>
      <button class="rev-enter" id="revEnter">▶ 从第一首开始聆听</button>
      <button class="rev-back"  onclick="goBack()">↩ 重新选择心情</button>
    </div>
  </div>
  <p class="view-label" style="margin-top:16px">移动端 · 选心情 → 今日抽牌 → 3 首推荐</p>
</div>

<script>
const SONGS = [
  { name:'Dawn Scene',         desc:'Gradual emotional rise, soft hope.',        state:'Cinematic', mood:'cinematic', grad:['#2a3d5c','#b98a5a'] },
  { name:'Lonely City',        desc:'Urban night, distance and isolation.',        state:'Cinematic', mood:'cinematic', grad:['#1c2333','#4a5a7a'] },
  { name:'Slow Memory',        desc:'Nostalgic texture, suspended feeling.',       state:'Cinematic', mood:'cinematic', grad:['#3a2c44','#7a6a8a'] },
  { name:'Imagined Landscape', desc:'Wider layered world for projection.',          state:'Cinematic', mood:'cinematic', grad:['#22323a','#8aa0a0'] },
  { name:'Glass Grid',         desc:'Transparent structures, low-freq breath.',    state:'Cinematic', mood:'cinematic', grad:['#1e3040','#6090b0'] },
  { name:'Drift Signal',       desc:'A distant carrier wave surfacing.',            state:'Cinematic', mood:'cinematic', grad:['#2c2240','#805a80'] },
  { name:'Phonk Drive',        desc:'Heavy pulse, distorted texture.',              state:'Motion',    mood:'motion',    grad:['#1a0c12','#7a2030'] },
  { name:'Trap Energy',        desc:'Sharp beat, strong low-end presence.',         state:'Motion',    mood:'motion',    grad:['#0e0c1a','#5a2a7a'] },
  { name:'Ritual Pulse',       desc:'Hypnotic loop with circular tension.',         state:'Motion',    mood:'motion',    grad:['#160a1a','#7a3a6a'] },
  { name:'Dark Cardio',        desc:'Repetitive rhythm for intense movement.',      state:'Motion',    mood:'motion',    grad:['#140c0c','#6a2a2a'] },
  { name:'Soft Rain',          desc:'Layered water texture, no beat.',              state:'Relax',     mood:'relax',     grad:['#1a2a3a','#4a7080'] },
  { name:'Evening Still',      desc:'Quiet room tone with faint warmth.',           state:'Relax',     mood:'relax',     grad:['#2a2030','#6a5a70'] },
];

const FORTUNES = {
  relax:     '今日宜静不宜动。让声音带你慢下来，不必急着做任何决定。',
  focus:     '今天的频率适合深度工作。用声音筑一道墙，把杂念挡在门外。',
  cinematic: '今天你的感受力很强。这几首歌会把你带进某个内心场景。',
  motion:    '今日能量正在上升。用这个节奏，把身体也带进状态里。',
};

/* ══ DESKTOP ══ */
const helix  = document.getElementById('helix');
const hInfo  = document.getElementById('hInfo');
const N = SONGS.length;
/* Looser: bigger radius + bigger vertical step + slight random wobble */
const R       = 230;
const VSTEP   = -30;
const SPREAD  = (N-1)*VSTEP;
const WOBBLE  = [8,-6,4,-8,5,-3,7,-5,3,-7,6,-4]; // random Z wobble per card

let panelTimer = null;

SONGS.forEach((s,i) => {
  const angleDeg = i * (360/N);
  const angleRad = angleDeg * Math.PI / 180;
  const yOff     = i * VSTEP - SPREAD/2;
  const zWobble  = WOBBLE[i] || 0;

  const card = document.createElement('div');
  card.className = 'hcard';
  const baseTransform = `rotateY(${angleDeg}deg) translateZ(${R + zWobble}px) translateY(${yOff}px)`;
  card.style.transform = baseTransform;
  card.innerHTML = `<div class="hcard-inner" style="background:linear-gradient(150deg,${s.grad[0]},${s.grad[1]})">
    <div class="badge">${s.state}</div><div class="title">${s.name}</div></div>`;

  let rt = null;
  card.addEventListener('mouseenter', () => {
    clearTimeout(rt);
    card.style.transform = `rotateY(${angleDeg}deg) translateZ(${R + zWobble + 44}px) translateY(${yOff - 8}px)`;
    card.style.filter    = 'brightness(1.3)';
    card.style.zIndex    = 30;
    clearTimeout(panelTimer);
    document.getElementById('hSt').textContent = s.state;
    document.getElementById('hNm').textContent = s.name;
    document.getElementById('hDs').textContent = s.desc;
    hInfo.classList.add('visible');
  });
  card.addEventListener('mouseleave', () => {
    rt = setTimeout(() => {
      card.style.transform = baseTransform;
      card.style.filter    = '';
      card.style.zIndex    = '';
    }, 80);
    panelTimer = setTimeout(() => hInfo.classList.remove('visible'), 100);
  });
  helix.appendChild(card);
});

let curR = 0, drag = false, dragX = 0, dragR = 0;
function applyRot(r) { curR=r; helix.style.transform=`rotateX(-14deg) rotateY(${r}deg)`; }
function spinDir(d) { applyRot(curR + d*(360/N)); }
helix.addEventListener('mousedown', e=>{ drag=true; dragX=e.clientX; dragR=curR; helix.style.transition='none'; });
window.addEventListener('mousemove', e=>{ if(drag) applyRot(dragR+(e.clientX-dragX)*.38); });
window.addEventListener('mouseup',   ()=>{ drag=false; helix.style.transition=''; });

/* ══ MOBILE ══ */
// date display
const now = new Date();
const dateStr = now.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
document.getElementById('todayDate').textContent = dateStr;

let chosenMood = null;
function pickMood(el) {
  document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
  chosenMood = el.dataset.mood;
}

/* Seeded RNG so same date → same draw (feels like horoscope) */
function seededRand(seed) {
  let s = seed;
  return () => { s = (s*9301+49297)%233280; return s/233280; };
}
function todaySeed() {
  const d = new Date(); return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}

function doDraw() {
  const mood = chosenMood || 'cinematic';
  const pool = SONGS.filter(s => s.mood === mood || s.mood === 'cinematic');
  const rand = seededRand(todaySeed() + mood.charCodeAt(0));
  // pick 3 distinct
  const picks = [], idxSet = new Set();
  while (picks.length < 3 && picks.length < pool.length) {
    const i = Math.floor(rand() * pool.length);
    if (!idxSet.has(i)) { idxSet.add(i); picks.push(pool[i]); }
  }
  // build fan
  const fan = document.getElementById('revFan');
  fan.innerHTML = '';
  picks.forEach((s,i) => {
    const c = document.createElement('div');
    c.className = 'r-card';
    c.innerHTML = `<div class="r-cover" style="background:linear-gradient(150deg,${s.grad[0]},${s.grad[1]})">
      <div class="r-badge">${s.state}</div><div class="r-name">${s.name}</div></div>`;
    fan.appendChild(c);
  });
  document.getElementById('fortuneText').textContent = FORTUNES[mood] || FORTUNES.cinematic;
  document.getElementById('revSub').textContent = `根据你今天的心情，为你抽出 ${picks.length} 首`;
  document.getElementById('revEnter').textContent = `▶ 从「${picks[0].name}」开始`;

  document.getElementById('screenMood').style.display   = 'none';
  const sr = document.getElementById('screenReveal');
  sr.style.display = 'flex';
}
function goBack() {
  document.getElementById('screenReveal').style.display = 'none';
  document.getElementById('screenMood').style.display   = 'flex';
}

/* ══ VIEW TOGGLE ══ */
function showView(v,btn) {
  document.querySelectorAll('.tog').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('desktopView').style.display = v==='desktop'?'flex':'none';
  document.getElementById('mobileView').style.display  = v==='mobile' ?'flex':'none';
}
</script>
</body>
</html>
