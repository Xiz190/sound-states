<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<title>3D Staircase + Tarot</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #090b12;
  color: #d0d8e8;
  font-family: -apple-system, 'PingFang SC', sans-serif;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-start;
  padding: 32px 0 60px;
  overflow-x: hidden;
}
h1 { font-size: 1.05rem; color: #5a7898; letter-spacing: .15em; font-weight: 400; margin-bottom: 4px; }
.sub { font-size: .74rem; color: #304050; margin-bottom: 24px; }

.toggle-row { display:flex; gap:10px; margin-bottom:36px; }
.tog { background:#101820; border:1px solid #283848; color:#486080; border-radius:20px; padding:6px 18px; font-size:.76rem; cursor:pointer; transition:all .18s; }
.tog.active { background:#1a3050; color:#78a8d8; border-color:#344a66; }

/* ═══════════════════════════════════════
   DESKTOP  ·  3D Helix Staircase
═══════════════════════════════════════ */
#desktopView { display:flex; flex-direction:column; align-items:center; width:100%; }

.scene-wrap {
  position: relative;
  width: 860px; height: 440px;
  display: flex; align-items: center; justify-content: center;
  overflow: visible;
}

/* perspective container */
.scene {
  perspective: 900px;
  perspective-origin: 50% 42%;
  width: 300px; height: 300px;
  position: relative;
}
.helix {
  width: 100%; height: 100%;
  transform-style: preserve-3d;
  /* tilt so we see the spiral from a slightly elevated angle */
  transform: rotateX(-18deg) rotateY(0deg);
  transition: transform .06s linear;
  position: relative;
}

.hcard {
  position: absolute;
  width: 100px; height: 150px;
  top: 50%; left: 50%;
  margin-top: -75px; margin-left: -50px;
  border-radius: 10px;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: filter .25s;
}
.hcard-inner {
  position: relative; width: 100%; height: 100%;
  border-radius: 10px; overflow: hidden;
  display: flex; flex-direction: column;
  justify-content: flex-end; padding: 9px;
  box-shadow: 0 8px 28px rgba(0,0,0,.7);
}
.hcard-inner::after {
  content:''; position:absolute; inset:0;
  background: linear-gradient(to top, rgba(0,0,0,.78) 0%, transparent 55%);
  border-radius: 10px;
}
.hcard .badge { position:relative; z-index:1; font-size:.52rem; color:#5070a0; letter-spacing:.12em; text-transform:uppercase; margin-bottom:2px; }
.hcard .title { position:relative; z-index:1; font-size:.62rem; color:#c8d8f0; line-height:1.25; }

/* highlight the front card */
.hcard.front .hcard-inner {
  box-shadow: 0 12px 40px rgba(0,0,0,.85), 0 0 30px rgba(80,140,230,.22);
}

/* info panel to the right */
.h-info {
  position: absolute; right: 20px; top: 50%;
  transform: translateY(-50%);
  width: 190px;
  background: rgba(12,18,32,.97);
  border: 1px solid #223040; border-radius: 14px; padding: 18px;
  opacity: 0; transition: opacity .2s;
  pointer-events: none;
}
.h-info.visible { opacity: 1; }
.h-state { font-size:.6rem; letter-spacing:.14em; color:#406880; text-transform:uppercase; display:flex; align-items:center; gap:6px; margin-bottom:9px; }
.h-state::before { content:''; width:5px; height:5px; border-radius:50%; background:#406880; flex-shrink:0; }
.h-name { font-size:.93rem; color:#c0d4ee; font-weight:500; margin-bottom:7px; }
.h-desc { font-size:.72rem; color:#486070; line-height:1.65; margin-bottom:15px; }
.h-btn-enter { display:block; width:100%; background:#1a3050; border:none; color:#68a0d8; border-radius:8px; padding:8px; font-size:.74rem; cursor:pointer; margin-bottom:7px; transition:background .18s; }
.h-btn-enter:hover { background:#243c60; }
.h-btn-next { display:block; width:100%; background:transparent; border:1px solid #1c2c3c; color:#385468; border-radius:8px; padding:7px; font-size:.72rem; cursor:pointer; }

/* controls */
.d-controls {
  display: flex; align-items: center; gap: 20px; margin-top: 20px;
}
.ctrl-btn {
  background: #101820; border: 1px solid #283848; color: #5070a0;
  border-radius: 8px; padding: 7px 16px; font-size: .76rem; cursor: pointer;
  transition: all .18s;
}
.ctrl-btn:hover { background: #182840; color: #7090c0; }
.ctrl-label { font-size: .7rem; color: #263040; letter-spacing: .08em; }

/* ═══════════════════════════════════════
   MOBILE  ·  Tarot Cards
═══════════════════════════════════════ */
#mobileView { display:none; flex-direction:column; align-items:center; }

.phone-frame {
  width: 340px; height: 640px;
  border: 2px solid #283848; border-radius: 38px;
  background: #090b12; position: relative; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.8);
}
.phone-notch {
  width: 100px; height: 20px; background: #090b12;
  border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;
  margin: 0 auto; position: relative; z-index: 10;
  border-left: 2px solid #283848; border-right: 2px solid #283848; border-bottom: 2px solid #283848;
}

.m-header { padding: 10px 22px 0; display:flex; justify-content:space-between; align-items:baseline; }
.m-title  { font-size: .85rem; color: #7090b0; letter-spacing:.14em; font-weight:400; }
.m-idx    { font-size: .65rem; color: #2a3a4a; }

/* tarot stage */
.tarot-stage {
  position: relative;
  height: 420px;
  display: flex; align-items: center; justify-content: center;
  margin-top: 10px;
}

/* ghost cards behind (depth stack) */
.tarot-stack {
  position: relative;
  width: 160px; height: 248px;
}
.tarot-ghost {
  position: absolute; top: 0; left: 0;
  width: 160px; height: 248px;
  border-radius: 14px;
  background: linear-gradient(150deg, #141a28, #1e2a3c);
  border: 1px solid #243040;
}
.tarot-ghost:nth-child(1) { transform: rotate(-6deg) translate(-10px,  6px); opacity: .35; }
.tarot-ghost:nth-child(2) { transform: rotate( 4deg) translate(  8px,  4px); opacity: .25; }
.tarot-ghost:nth-child(3) { transform: rotate(-2deg) translate( -4px, 10px); opacity: .18; }

/* main tarot card — flip container */
.tarot-card {
  position: absolute;
  width: 160px; height: 248px;
  cursor: pointer;
  perspective: 600px;
  z-index: 5;
}
.tarot-flipper {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .6s cubic-bezier(.45,.05,.55,.95);
}
.tarot-card.flipped .tarot-flipper { transform: rotateY(180deg); }

.tarot-face, .tarot-back {
  position: absolute; inset: 0;
  border-radius: 14px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

/* BACK of tarot card: decorative pattern */
.tarot-back {
  background: linear-gradient(135deg, #0e1520, #1a2438);
  border: 1px solid #2a3a52;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 32px rgba(0,0,0,.7);
  overflow: hidden;
}
.tarot-back-pattern {
  width: 100%; height: 100%;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
/* decorative SVG-like border inside the back */
.tarot-back-inner {
  width: 136px; height: 224px;
  border: 1px solid rgba(60,100,150,.4);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.tarot-back-inner::before {
  content: '';
  position: absolute; inset: 6px;
  border: 1px solid rgba(60,100,150,.25);
  border-radius: 7px;
}
.tarot-back-symbol {
  font-size: 2.4rem; opacity: .18; user-select:none;
  letter-spacing: 0;
}
/* corner ornaments */
.tarot-back-inner::after {
  content: '✦';
  position: absolute; top: 10px; right: 12px;
  font-size: .55rem; color: rgba(80,130,190,.3);
}

/* FRONT of tarot card */
.tarot-face {
  transform: rotateY(180deg);
  overflow: hidden;
  border: 1px solid #2a3a52;
  box-shadow: 0 10px 40px rgba(0,0,0,.8), 0 0 28px rgba(60,120,220,.14);
}
.tarot-face-cover {
  width: 100%; height: 100%;
  border-radius: 14px;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  justify-content: flex-end; padding: 14px;
}
.tarot-face-cover::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.1) 60%, transparent 100%);
  border-radius: 14px;
}
.t-state { position:relative; z-index:1; font-size:.6rem; color:#5080a8; letter-spacing:.14em; text-transform:uppercase; margin-bottom:4px; }
.t-name  { position:relative; z-index:1; font-size:.95rem; color:#c8daf0; font-weight:500; line-height:1.25; margin-bottom:6px; }
.t-desc  { position:relative; z-index:1; font-size:.68rem; color:#5a7090; line-height:1.55; }

/* tarot tap hint */
.tarot-tap-hint {
  position: absolute; top: -28px; left: 50%;
  transform: translateX(-50%);
  font-size: .6rem; color: #2a3a50; letter-spacing: .1em;
  white-space: nowrap; pointer-events: none;
}
.tarot-tap-hint.hide { opacity: 0; }

/* nav row */
.tarot-nav {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; margin-top: 18px; padding: 0 22px;
}
.t-nav-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: #101820; border: 1px solid #283848;
  color: #5070a0; font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .18s;
}
.t-nav-btn:hover { background: #1a2a3c; color: #80a8d0; }
.t-nav-dots { display: flex; gap: 6px; align-items: center; }
.t-dot { width: 5px; height: 5px; border-radius: 50%; background: #1c2c3c; transition: background .2s; }
.t-dot.active { background: #5080a8; }

/* bottom action */
.tarot-actions {
  position: absolute; bottom: 18px; left: 0; right: 0;
  padding: 0 22px;
}
.t-btn-enter {
  display: block; width: 100%; background: #1a3050; border: none;
  color: #68a0d8; border-radius: 12px; padding: 12px; font-size: .8rem;
  cursor: pointer; transition: background .18s; letter-spacing: .04em;
}
.t-btn-enter:hover { background: #223c62; }

.view-label { font-size: .68rem; color: #263040; letter-spacing: .08em; margin-top: 16px; }
</style>
</head>
<body>
<h1>Sound States</h1>
<p class="sub">选择查看桌面端或移动端版本</p>
<div class="toggle-row">
  <button class="tog active" onclick="showView('desktop',this)">🖥 桌面端 — 3D 旋转楼梯</button>
  <button class="tog"        onclick="showView('mobile', this)">🃏 移动端 — 塔罗卡牌</button>
</div>

<!-- ════════ DESKTOP ════════ -->
<div id="desktopView">
  <div class="scene-wrap">
    <div class="scene">
      <div class="helix" id="helix"><!-- cards injected --></div>
    </div>
    <div class="h-info" id="hInfo">
      <div class="h-state" id="hState"></div>
      <div class="h-name"  id="hName"></div>
      <div class="h-desc"  id="hDesc"></div>
      <button class="h-btn-enter">▶ 进入聆听</button>
      <button class="h-btn-next">下一张 →</button>
    </div>
  </div>
  <div class="d-controls">
    <button class="ctrl-btn" onclick="spinDir(-1)">◀ 旋转</button>
    <span class="ctrl-label">拖拽 / 点击旋转</span>
    <button class="ctrl-btn" onclick="spinDir(1)">旋转 ▶</button>
  </div>
  <p class="view-label" style="margin-top:14px">桌面端 · 3D 螺旋楼梯 · 悬停出现简介</p>
</div>

<!-- ════════ MOBILE ════════ -->
<div id="mobileView">
  <div class="phone-frame">
    <div class="phone-notch"></div>
    <div class="m-header">
      <div class="m-title">Sound States</div>
      <div class="m-idx" id="mIdx">1 / 12</div>
    </div>
    <div class="tarot-stage">
      <!-- ghost stack -->
      <div class="tarot-stack">
        <div class="tarot-ghost"></div>
        <div class="tarot-ghost"></div>
        <div class="tarot-ghost"></div>
        <!-- main card -->
        <div class="tarot-card" id="tarotCard" onclick="flipCard()">
          <div class="tarot-flipper" id="tarotFlipper">
            <!-- BACK -->
            <div class="tarot-back">
              <div class="tarot-back-pattern">
                <div class="tarot-back-inner">
                  <div class="tarot-back-symbol">☽</div>
                </div>
              </div>
            </div>
            <!-- FRONT -->
            <div class="tarot-face" id="tarotFace">
              <div class="tarot-face-cover" id="tarotCover">
                <div class="t-state" id="tState"></div>
                <div class="t-name"  id="tName"></div>
                <div class="t-desc"  id="tDesc"></div>
              </div>
            </div>
          </div>
          <div class="tarot-tap-hint" id="tapHint">点击翻转</div>
        </div>
      </div>
    </div>
    <!-- nav -->
    <div class="tarot-nav">
      <button class="t-nav-btn" onclick="tarotNav(-1)">‹</button>
      <div class="t-nav-dots" id="tDots"></div>
      <button class="t-nav-btn" onclick="tarotNav(1)">›</button>
    </div>
    <!-- enter button (only shown when flipped) -->
    <div class="tarot-actions" id="tarotActions" style="opacity:0;pointer-events:none;transition:opacity .3s">
      <button class="t-btn-enter">▶ 进入这个状态聆听</button>
    </div>
  </div>
  <p class="view-label">移动端 · 塔罗翻牌 · 左右切换曲目</p>
</div>

<script>
const SONGS = [
  { name:'Dawn Scene',         desc:'Gradual emotional rise, soft hope.',         state:'Cinematic', grad:['#2a3d5c','#b98a5a'] },
  { name:'Lonely City',        desc:'Urban night, distance and isolation.',         state:'Cinematic', grad:['#1c2333','#4a5a7a'] },
  { name:'Slow Memory',        desc:'Nostalgic texture, suspended feeling.',        state:'Cinematic', grad:['#3a2c44','#7a6a8a'] },
  { name:'Imagined Landscape', desc:'Wider layered world for projection.',           state:'Cinematic', grad:['#22323a','#8aa0a0'] },
  { name:'Glass Grid',         desc:'Transparent structures, low-freq breath.',     state:'Cinematic', grad:['#1e3040','#6090b0'] },
  { name:'Drift Signal',       desc:'A distant carrier wave surfacing.',             state:'Cinematic', grad:['#2c2240','#805a80'] },
  { name:'Phonk Drive',        desc:'Heavy pulse, distorted texture.',               state:'Motion',    grad:['#1a0c12','#7a2030'] },
  { name:'Trap Energy',        desc:'Sharp beat, strong low-end presence.',          state:'Motion',    grad:['#0e0c1a','#5a2a7a'] },
  { name:'Ritual Pulse',       desc:'Hypnotic loop with circular tension.',          state:'Motion',    grad:['#160a1a','#7a3a6a'] },
  { name:'Dark Cardio',        desc:'Repetitive rhythm for intense movement.',       state:'Motion',    grad:['#140c0c','#6a2a2a'] },
  { name:'Soft Rain',          desc:'Layered water texture, no beat.',               state:'Relax',     grad:['#1a2a3a','#4a7080'] },
  { name:'Evening Still',      desc:'Quiet room tone with faint warmth.',            state:'Relax',     grad:['#2a2030','#6a5a70'] },
];

/* ══════ DESKTOP: 3D helix ══════ */
const helix = document.getElementById('helix');
const hInfo = document.getElementById('hInfo');
const N = SONGS.length;
const R = 160;          // helix radius
const STEP_Y = -22;     // vertical rise per step (negative = up in CSS)
const SPREAD_Y = (N - 1) * STEP_Y;
let helixY = -SPREAD_Y / 2;  // start offset to center vertically
const ANGLE_STEP = 360 / N;

let panelTimer = null;

SONGS.forEach((s, i) => {
  const angleDeg = i * ANGLE_STEP;
  const angleRad = (angleDeg * Math.PI) / 180;
  const yOffset  = i * STEP_Y - SPREAD_Y / 2;

  const card = document.createElement('div');
  card.className = 'hcard';
  card.style.transform = `rotateY(${angleDeg}deg) translateZ(${R}px) translateY(${yOffset}px)`;
  card.innerHTML = `<div class="hcard-inner" style="background:linear-gradient(150deg,${s.grad[0]},${s.grad[1]})">
    <div class="badge">${s.state}</div><div class="title">${s.name}</div></div>`;

  let restoreTimer = null;
  card.addEventListener('mouseenter', () => {
    clearTimeout(restoreTimer);
    // push card toward viewer (along its own Z axis after helix rotation)
    card.style.transform = `rotateY(${angleDeg}deg) translateZ(${R + 36}px) translateY(${yOffset - 8}px)`;
    card.style.filter    = 'brightness(1.25)';
    card.style.zIndex    = 30;
    clearTimeout(panelTimer);
    document.getElementById('hState').textContent = s.state;
    document.getElementById('hName').textContent  = s.name;
    document.getElementById('hDesc').textContent  = s.desc;
    hInfo.classList.add('visible');
  });
  card.addEventListener('mouseleave', () => {
    restoreTimer = setTimeout(() => {
      card.style.transform = `rotateY(${angleDeg}deg) translateZ(${R}px) translateY(${yOffset}px)`;
      card.style.filter    = '';
      card.style.zIndex    = '';
    }, 80);
    panelTimer = setTimeout(() => hInfo.classList.remove('visible'), 100);
  });
  helix.appendChild(card);
});

/* helix rotation: drag or buttons */
let curRotY = 0, isDragging = false, dragStartX = 0, dragStartRot = 0;
function applyHelixRot(deg) {
  curRotY = deg;
  helix.style.transform = `rotateX(-18deg) rotateY(${deg}deg)`;
}
function spinDir(dir) { applyHelixRot(curRotY + dir * ANGLE_STEP); }

helix.addEventListener('mousedown', e => { isDragging = true; dragStartX = e.clientX; dragStartRot = curRotY; helix.style.transition = 'none'; });
window.addEventListener('mousemove', e => { if (!isDragging) return; applyHelixRot(dragStartRot + (e.clientX - dragStartX) * 0.4); });
window.addEventListener('mouseup',   () => { isDragging = false; helix.style.transition = ''; });

/* ══════ MOBILE: tarot ══════ */
let tarotIdx = 0;
let flipped   = false;

// build dots
const dotsEl = document.getElementById('tDots');
SONGS.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 't-dot' + (i === 0 ? ' active' : '');
  dotsEl.appendChild(d);
});

function loadTarotCard(idx, skipFlip) {
  const s = SONGS[idx];
  document.getElementById('mIdx').textContent = `${idx+1} / ${SONGS.length}`;
  document.getElementById('tState').textContent = s.state;
  document.getElementById('tName').textContent  = s.name;
  document.getElementById('tDesc').textContent  = s.desc;
  document.getElementById('tarotCover').style.background = `linear-gradient(150deg,${s.grad[0]},${s.grad[1]})`;
  // update dots
  document.querySelectorAll('.t-dot').forEach((d,i) => d.classList.toggle('active', i === idx));
  if (!skipFlip) {
    // flip back then flip to new
    const card = document.getElementById('tarotCard');
    card.classList.remove('flipped');
    flipped = false;
    document.getElementById('tarotActions').style.opacity = 0;
    document.getElementById('tarotActions').style.pointerEvents = 'none';
    document.getElementById('tapHint').classList.remove('hide');
  }
}

function flipCard() {
  const card = document.getElementById('tarotCard');
  flipped = !flipped;
  card.classList.toggle('flipped', flipped);
  const actions = document.getElementById('tarotActions');
  actions.style.opacity       = flipped ? '1' : '0';
  actions.style.pointerEvents = flipped ? 'auto' : 'none';
  if (flipped) document.getElementById('tapHint').classList.add('hide');
}

function tarotNav(dir) {
  tarotIdx = (tarotIdx + dir + SONGS.length) % SONGS.length;
  loadTarotCard(tarotIdx, false);
}

loadTarotCard(0, true);

/* ══════ VIEW TOGGLE ══════ */
function showView(v, btn) {
  document.querySelectorAll('.tog').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('desktopView').style.display = v === 'desktop' ? 'flex' : 'none';
  document.getElementById('mobileView').style.display  = v === 'mobile'  ? 'flex' : 'none';
}
</script>
</body>
</html>
