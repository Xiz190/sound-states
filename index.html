<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sound States — V1 Demo</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0c0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sound States" />
  <link rel="apple-touch-icon" href="cover-cinematic.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..500,50&family=Noto+Serif+SC:wght@300;400;500&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 动态背景层:声音驱动的颗粒/脉冲 / dynamic background, audio-driven -->
  <canvas id="bgCanvas"></canvas>
  <div id="genBg"></div><!-- 生成板块:当前场景色的呼吸色场背景 -->
  <!-- 背景发光层:由声音驱动 / glow layer driven by audio -->
  <div id="glow"></div>

  <!-- 语言切换 + 声音开关 / language toggle + sound toggle (全局固定) -->
  <div id="langToggle">
    <button class="sound-toggle" id="soundToggle"></button>
    <span>|</span>
    <button data-lang="en" class="active">EN</button>
    <span>|</span>
    <button data-lang="zh">中</button>
  </div>

  <!-- 导航 / navigation -->
  <button id="menuBtn" aria-label="Menu"><svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><path d="M1 2h16M1 7h16M1 12h16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
  <nav id="menu">
    <button data-go="landing"    data-i18n="navHome"></button>
    <button data-go="selection"  data-i18n="navWorlds"></button>
    <button data-go="browse"     data-i18n="navBrowse"></button>
    <button id="menuNavigator" data-i18n="navNavigator"></button>
    <button data-go="about"      data-i18n="navAbout"></button>
  </nav>

  <!-- ============ 01 Landing 首屏 ============ -->
  <section id="landing" class="screen active">
    <div class="landing-inner">
      <div class="land-halo" id="landHalo" aria-hidden="true"></div><!-- 五个板块的颜色轮流缓缓流动;点「开始」时放大散开成圆盘 -->
      <h1 class="title">Sound States</h1>
      <p class="subtitle" data-i18n="subtitle"></p>
      <p class="guide" data-i18n="guide"></p>
      <div class="sel-gate-btns landing-gate-btns">
        <button id="landingYesBtn" class="sel-gate-btn sel-gate-btn--yes" data-i18n="gateYes"></button>
      </div>
      <p class="hint" data-i18n="hint"></p>
    </div>
  </section>

  <!-- ============ 02 State Selection 状态选择 ============ -->
  <section id="selection" class="screen sel2">
    <header class="top-bar">
      <button class="back-btn" data-go="landing" data-i18n="backBtn"></button>
    </header>

    <!-- 选择页:左圆盘(按 Russell 角度分区,封面色缓缓流动)+ 右舞台(开场 → 悬停预览 → 点击后画出数据图 → 飞进播放页) -->
    <div class="sel2-grid">
      <svg id="selDisc" viewBox="-300 -300 600 600" role="group" aria-label="States"></svg>
      <div class="sel2-stage" aria-live="polite">
        <div class="sel2-layer show" id="selIntro">
          <h1 class="sel2-h" data-i18n="selQ"></h1>
          <p class="sel2-lede" id="selLede"></p>
          <p class="sel2-hint" id="selHint"><i></i><span></span></p>
          <div class="sel2-links">
            <button id="selUnsureBtn" data-i18n="selUnsure"></button>
            <button id="browseAllBtn" data-i18n="selAll"></button>
          </div>
        </div>
        <div class="sel2-layer sel2-pv" id="selPreview">
          <span class="sel2-grp"><i id="selPvDot"></i><span id="selPvGrp"></span></span>
          <h2 class="sel2-name" id="selPvName"></h2>
          <p class="sel2-desc" id="selPvDesc"></p>
          <div class="sel2-more"><div><div class="sel2-fig" id="selPvFig"></div><p class="sel2-chg" id="selPvChg"></p></div></div>
          <div><button class="sel2-enter" id="selPvEnter"><span id="selPvEnterTxt"></span>
            <svg width="14" height="10" viewBox="0 0 14 10" aria-hidden="true"><path d="M1 5h12M9 1l4 4-4 4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
        </div>
        <div class="sel2-layer sel2-gd" id="selGuide">
          <span class="sel2-grp" data-i18n="selGuideKicker"></span>
          <h2 class="sel2-name" data-i18n="selGuideName"></h2>
          <p class="sel2-desc" data-i18n="selGuideLead"></p>
          <div class="sel2-opts">
            <button data-go-board="motion"><span data-i18n="navGuideDischarge"></span><small data-i18n="navMotion"></small></button>
            <button data-go-board="cinematic"><span data-i18n="navGuideDiversion"></span><small data-i18n="navImagine"></small></button>
            <button data-go-board="relax"><span data-i18n="navGuideSolace"></span><small data-i18n="navRelax"></small></button>
            <button data-go-board="sleep"><span data-i18n="selGuideRevival"></span><small data-i18n="selSleep"></small></button>
          </div>
          <p class="sel2-src" data-i18n="selGuideSrc"></p>
          <a class="sel2-vis" href="vision-page.html" target="_blank" rel="noopener" data-i18n="navGuideVision"></a>
        </div>
      </div>
    </div>

    <!-- 旧卡片/今日推荐:保留节点给旧代码引用,不显示 / legacy nodes kept hidden so old code keeps working -->
    <div hidden><div class="cards" id="stateCards"></div><button id="dailyBtn"><span class="ring-txt"></span></button></div>
  </section>

  <!-- ============ 03 Scene 场景页(含弧形封面) ============ -->
  <section id="scene" class="screen">
    <header class="top-bar">
      <button class="back-btn" data-go="selection" data-i18n="backBtn"></button>
    </header>

    <h2 class="screen-title" id="sceneTitle">Cinematic</h2>
    <p class="screen-sub" id="sceneSub"></p>

    <!-- 弧形封面瀑布流 / arc coverflow (sketch B) -->
    <div class="coverflow" id="coverflow"></div>
    <!-- 生成板块:场景选择标签(替代封面流) -->
    <div id="genSceneList"></div>

    <div class="cover-nav">
      <button class="round-btn" id="prevCover" aria-label="Previous track"><svg width="9" height="14" viewBox="0 0 9 14" aria-hidden="true"><path d="M7.5 1.5 2 7l5.5 5.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="round-btn" id="nextCover" aria-label="Next track"><svg width="9" height="14" viewBox="0 0 9 14" aria-hidden="true"><path d="M1.5 1.5 7 7l-5.5 5.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>

    <!-- 主播放器 / main player -->
    <div class="player">
      <div class="track-name" id="trackName">—</div>
      <div class="track-desc" id="trackDesc"></div>
      <button class="play-btn" id="playBtn"></button>

      <!-- 进度条 / seek bar -->
      <div class="seek-row">
        <span class="time-label" id="timeCur">0:00</span>
        <input type="range" id="seekBar" class="seek-bar" min="0" max="100" value="0" step="0.1" />
        <span class="time-label" id="timeDur">0:00</span>
        <button class="loop-btn" id="loopBtn" title="播放模式 / Play mode"></button>
      </div>
      <!-- 此刻的声音:播放页主角 —— 声部/通透度随能量实时进退(给用户看的反馈,讲解细节在讲解页)-->
      <div class="now-panel" id="nowPanel">
        <div class="now-head"><span class="now-title"></span><span class="now-char" id="nowChar"></span></div>
        <div class="now-rows" id="nowRows"></div>
        <p class="now-cap" id="nowCap"></p>
      </div>

      <!-- 生成板块控制(工作/睡眠) · 仅 .player.gen-mode 显示 -->
      <style>
        #genControls { display:none; margin-top:4px; }
        .player.gen-mode #genControls { display:block; }
        .player.gen-mode .seek-row,
        .player.gen-mode .atmosphere,
        .player.gen-mode #atmosDesc,
        .player.gen-mode .eq-strip,
        .player.gen-mode #valenceDesc,
        .player.gen-mode #ctrlLogic,
        .player.gen-mode .mini-russell-wrap { display:none !important; }
        /* 心率模式栏(实时/模拟/自由)+ 说明:工作/睡眠也保留 —— 心率贯穿所有板块 */
        #genControls .gen-phase, #genControls .gen-presets { display:flex; gap:8px; justify-content:center; margin:10px 0; }
        #genControls .gen-row { display:flex; align-items:center; gap:12px; margin:12px 6px; }
        #genControls .gen-lab { flex:0 0 92px; font-size:12px; opacity:.7; text-align:right; white-space:nowrap; }
        #genControls .gen-row input[type=range] { flex:1; }
        /* gen 滑块统一到全站外观(与 .atmos-slider 一致,替换浏览器默认蓝色) */
        #genControls input[type=range] {
          -webkit-appearance:none; appearance:none;
          height:3px; border-radius:3px; background:rgba(255,255,255,.18);
          outline:none; cursor:pointer;
        }
        #genControls input[type=range]::-webkit-slider-thumb {
          -webkit-appearance:none; appearance:none;
          width:15px; height:15px; border-radius:50%;
          background:var(--accent); cursor:pointer;
          box-shadow:0 0 9px rgba(var(--glow-color),.55);
        }
        #genControls input[type=range]::-moz-range-thumb {
          width:15px; height:15px; border:none; border-radius:50%;
          background:var(--accent); cursor:pointer;
        }
        #genAdvanced { display:none; margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,.12); }
        #genAdvanced .gen-layer { display:grid; grid-template-columns:18px 1fr 66px 36px; align-items:center; gap:8px; padding:5px 4px; }
        #genAdvanced .gl-nm { font-size:12px; opacity:.8; }
        #genAdvanced .gl-val { font-size:11px; opacity:.6; text-align:right; font-variant-numeric:tabular-nums; }
        #genAdvanced .gen-layer input[type=range] { width:100%; }
        /* 生成板块:去封面卡片,内容上移,背景=场景色呼吸色场 */
        #genBg { display:none; position:fixed; inset:0; z-index:-1;
          background:radial-gradient(125% 125% at 50% 32%, var(--gen-c1,#26304e), var(--gen-c2,#0c1020) 72%);
          animation:genBreathe 11s ease-in-out infinite; transition:background 1.2s ease; }
        @keyframes genBreathe { 0%,100%{ transform:scale(1.02); filter:brightness(.93) saturate(1); }
                                50%   { transform:scale(1.06); filter:brightness(1.07) saturate(1.06); } }
        body.gen-scene #genBg { display:block; }
        body.gen-scene #bgCanvas { display:none; }
        body.gen-scene #coverflow { display:none; }
        body.gen-scene .cover-nav { display:none; }
        #genSceneList { display:none; }
        body.gen-scene #genSceneList { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:26px 16px 6px; }
        #genSceneList .gen-chip { padding:9px 20px; border-radius:999px; border:1px solid rgba(255,255,255,.22);
          background:rgba(255,255,255,.05); color:#e9eef2; font-size:14px; letter-spacing:.02em; cursor:pointer;
          transition:background .2s, color .2s, border-color .2s; }
        #genSceneList .gen-chip:hover { background:rgba(255,255,255,.12); }
        #genSceneList .gen-chip.active { background:rgba(255,255,255,.92); color:#14181c; border-color:transparent; font-weight:600; }
      </style>
      <div id="genControls">
        <div class="gen-phase" id="genPhase">
          <button class="hm-btn" id="genDay" data-i18n="genDay"></button>
          <button class="hm-btn" id="genNight" data-i18n="genNight"></button>
        </div>
        <!-- 此刻的声音(生成板块):下面三条滑条本来就随引擎实时移动,这里只说明"是心率在推它们"+ 入睡弧进度 -->
      <div class="gen-now" id="genNow">
        <div class="now-head"><span class="now-title" data-i18n="nowTitle"></span><span class="now-char" id="genArcTxt"></span></div>
        <div class="gen-fig" id="genFig"></div>
        <canvas class="gen-portrait" id="genPortrait" aria-label="Live sound portrait"></canvas>
        <div class="gen-arc" id="genArc" style="display:none"><span class="gen-arc-fill" id="genArcFill"></span></div>
        <p class="now-cap" id="genNowCap"></p>
      </div>
      <div class="gen-row"><span class="gen-lab" data-i18n="genWarm"></span><input type="range" id="mWarm"  min="0" max="100" value="45"></div>
        <div class="gen-row"><span class="gen-lab" data-i18n="genSpace"></span><input type="range" id="mSpace" min="0" max="100" value="30"></div>
        <div class="gen-row"><span class="gen-lab" data-i18n="genLive"></span><input type="range" id="mLive"  min="0" max="100" value="55"></div>
        <div class="gen-presets">
          <button class="hm-btn" id="genSleep" data-i18n="genSleep"></button>
          <button class="hm-btn" id="genWork"  data-i18n="genWork"></button>
        </div>
        <button class="hm-btn" id="genAdvToggle" data-i18n="genAdvanced" style="width:100%;margin-top:6px;"></button>
        <div id="genAdvanced">
          <div class="gen-presets" id="genBreatheWrap" style="margin-bottom:6px;">
            <button class="hm-btn" id="genBreatheAuto"   data-i18n="genBreatheAuto"></button>
            <button class="hm-btn" id="genBreatheManual" data-i18n="genBreatheManual"></button>
          </div>
          <div id="genLayers"></div>
          <div class="gen-row"><span class="gen-lab" data-i18n="genGlue"></span><input type="range" id="mGlue" min="0" max="1" step="0.01" value="0.9"></div>
          <div class="gen-row"><span class="gen-lab" data-i18n="genVol"></span><input type="range" id="mVol" min="0" max="1" step="0.01" value="0.85"></div>
        </div>
      </div>

      <!-- 输入 · 你的心率:模式分段按钮 + 当前模式的控件;静息基线收成一行,点「修改」展开 -->
      <section class="hr-panel" id="hrPanel">
        <div class="hr-head">
          <span class="hr-title" data-i18n="hrPanelTitle"></span>
          <div class="heart-mode-bar" id="heartModeBar" role="tablist">
            <button class="hm-btn active" data-mode="auto" data-i18n="hmAuto" data-desckey="hmDescAuto"></button>
            <button class="hm-btn" data-mode="sim" data-i18n="hmSim" data-desckey="hmDescSim"></button>
            <button class="hm-btn" data-mode="free" data-i18n="hmFree" data-desckey="hmDescFree"></button>
          </div>
        </div>
        <p class="hm-desc" id="hmDesc"></p>
        <div class="heart-rate-bar hr-live" id="heartBar">
          <span class="hr-big"><span id="heartBPMDisplay" class="heart-bpm">--</span><small>BPM</small></span>
          <button id="heartConnect" class="heart-btn"></button>
        </div>
        <div class="heart-rate-bar hr-sim" id="heartSimBar" style="display:none">
          <span class="hr-big"><span id="heartSimBPM" class="heart-bpm">70</span><small>BPM</small><em id="hrSimRel"></em></span>
          <div class="hr-track">
            <input type="range" id="heartSimSlider" class="atmos-slider" min="45" max="160" value="70" aria-label="Simulated heart rate (BPM)" />
            <span class="hr-base" id="hrBaseMark" aria-hidden="true"></span>
            <span class="hr-ends"><span>45</span><span>160</span></span>
          </div>
        </div>
        <div class="hr-manual">
      <div class="atmosphere">
        <span class="var-label" data-i18n="atmosLabel"></span>
        <span class="slider-end" data-i18n="veiled"></span>
        <input type="range" id="atmosSlider" class="atmos-slider" min="0" max="100" value="100" />
        <span class="slider-end" data-i18n="natural"></span>
        <button class="reset-btn" id="atmosReset" title="Reset" aria-label="Reset"><svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7a4.5 4.5 0 1 0 1.4-3.3M2.5 1.8v2.4h2.4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <p class="eq-desc" id="atmosDesc"></p>
      <div class="eq-strip">
        <span class="var-label" data-i18n="eqLabel"></span>
        <div class="eq-btns">
          <button class="eq-btn" data-eq="flat"></button>
          <button class="eq-btn" data-eq="grand"></button>
          <button class="eq-btn" data-eq="power"></button>
          <button class="eq-btn" data-eq="clear"></button>
        </div>
        <p class="eq-desc" id="eqDesc"></p>
      </div>
      <div class="valence atmosphere" id="valenceRow">
        <span class="var-label" data-i18n="valenceLabel"></span>
        <span class="slider-end" data-i18n="valCoolEnd"></span>
        <input type="range" id="valenceSlider" class="atmos-slider" min="-100" max="100" value="0" />
        <span class="slider-end" data-i18n="valWarmEnd"></span>
        <button class="reset-btn" id="valenceReset" title="Reset" aria-label="Reset"><svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7a4.5 4.5 0 1 0 1.4-3.3M2.5 1.8v2.4h2.4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <p class="eq-desc" id="valenceDesc"></p>
        </div>
        <div class="heart-rate-bar hr-rest" id="heartRestingBar" style="display:none">
          <span class="hr-rest-line"><span data-i18n="restingLabel"></span> <b id="hrRestVal">70</b> BPM <button type="button" class="hr-rest-edit" id="hrRestEdit" data-i18n="restEdit"></button></span>
          <span class="hr-rest-editor">
            <input type="number" id="restingBPMInput" class="resting-input" min="40" max="120" step="1" value="70" aria-label="Resting heart rate" />
            <span>BPM</span>
            <p class="resting-hint" id="restingHintTxt" data-i18n="restingHint"></p>
          </span>
        </div>
      </section>
      <p class="ctrl-logic" id="ctrlLogic" data-i18n="ctrlLogic"></p>
      <!-- 情绪坐标迷你指示器 / mini Russell indicator -->
      <div class="mini-russell-wrap">
        <canvas id="miniRussell"></canvas>
        <div class="mini-russell-info">
          <span class="mini-coord" id="miniCoord"></span>
          <span class="mini-src">Russell (1980)</span>
        </div>
      </div>

      <!-- 算法洞察面板 / Algorithm insight panel -->
      <div class="algo-insight-wrap">
        <button class="algo-insight-toggle" id="algoInsightToggle">◎ <span data-i18n="algoInsightLabel"></span></button>
        <div class="algo-insight-panel" id="algoInsightPanel">
          <div class="ai-row" id="aiBPMRow">
            <span class="ai-label" data-i18n="algoInsightBPM"></span>
            <span class="ai-bpm" id="aiBPM">--</span>
          </div>
          <div class="ai-row">
            <span class="ai-label" data-i18n="algoInsightArousal"></span>
            <div class="ai-bar-wrap"><div class="ai-bar" id="aiArousalBar"></div></div>
            <span class="ai-num" id="aiArousalNum">--</span>
          </div>
          <div class="ai-row">
            <span class="ai-label" data-i18n="algoInsightValence"></span>
            <div class="ai-bar-wrap"><div class="ai-bar ai-bar-v" id="aiValenceBar"></div></div>
            <span class="ai-num" id="aiValenceNum">--</span>
          </div>
          <div class="ai-divider"></div>
          <div class="ai-output-row">
            <span class="ai-arrow">→</span>
            <span class="ai-out-label" data-i18n="algoBoard"></span>
            <span class="ai-out-val ai-highlight" id="aiBoard">--</span>
          </div>
          <div class="ai-output-row">
            <span class="ai-arrow">→</span>
            <span class="ai-out-label" data-i18n="algoEQ"></span>
            <span class="ai-out-val" id="aiEQPanel">--</span>
          </div>
          <div class="ai-output-row">
            <span class="ai-arrow">→</span>
            <span class="ai-out-label" data-i18n="algoAtmos"></span>
            <span class="ai-out-val" id="aiAtmosPanel">--</span>
          </div>
          <p class="ai-src">Russell (1980) · BRECVEMA (Juslin, 2013) · Karageorghis &amp; Priest (2012)</p>
        </div>
      </div>

      <p class="hp-hint" id="hpHint" data-i18n="headphoneHint"></p>

      <p class="player-note" id="varNote"></p>
      <p class="placeholder-note" data-i18n="placeholderNote"></p>
    </div>
  </section>

  <!-- ============ About / Process / Reflection — tabbed ============ -->
  <section id="about" class="screen content-page">
    <header class="top-bar">
      <button class="back-btn" data-go="selection" data-i18n="backBtn"></button>
    </header>

    <!-- 标签栏 / tab bar -->
    <div class="about-tab-bar" role="tablist">
      <button class="about-tab active" data-about-tab="panel-about"      role="tab" data-i18n="aboutTitle"></button>
      <button class="about-tab"        data-about-tab="panel-process"    role="tab" data-i18n="processTitle"></button>
      <button class="about-tab"        data-about-tab="panel-reflection" role="tab" data-i18n="reflTitle"></button>
    </div>

    <!-- 面板 1：关于 / Panel 1: About -->
    <div class="about-panel active" id="panel-about" role="tabpanel">
      <div class="prose">
        <p data-i18n="aboutP1"></p>
        <p data-i18n="aboutP2"></p>
        <p class="emphasis" data-i18n="aboutRole"></p>
      </div>
    </div>

    <!-- 面板 2：制作过程 / Panel 2: Process -->
    <div class="about-panel" id="panel-process" role="tabpanel">
      <div class="prose">
        <p data-i18n="processIntro"></p>
        <p data-i18n="proc1"></p>
        <p data-i18n="proc2"></p>
        <p data-i18n="proc3"></p>
        <p data-i18n="proc4"></p>
        <p data-i18n="proc5"></p>

  <script>
    // 声景引擎栈(sound-engines + scene-config + scene-engine)隔离加载到独立作用域→暴露 window.SceneStack。
    // 它们的 `let ctx` 只在此函数作用域内,不进全局,不与主站 script.js 的 ctx 冲突;引擎跑自己的 AudioContext。
    window.__sceneStackReady = (async function () {
      try {
        const files = ['sound-engines.js', 'scene-config.js', 'scene-engine.js'];
        const src = await Promise.all(files.map(f => fetch(f).then(r => r.text())));
        const factory = new Function(src.join('\n;\n') + '\n; return { createSceneEngine, SoundscapeConfig };');
        window.SceneStack = factory();
        return window.SceneStack;
      } catch (e) { console.error('[SceneStack] load failed:', e); return null; }
    })();
  </script>
