<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spatial Composer — Sound States · Process</title>
<style>
  /* 承袭 model-diagram 夜色系统;工作/睡眠板块=睡眠蓝 accent。旧 var 名保留(JS/内联样式引用),值改为 model-diagram */
  :root{
    color-scheme:dark;   /* 原生 select 下拉/滚动条渲染暗色,不再白底 */
    --bg:#0c0e14; --panel:#101219; --line:rgba(255,255,255,.09); --ink:#e7e3da; --dim:#8b8a96; --accent:#b9a16b;
    --glow:185,161,107; --faint:#7a7984; --hair2:rgba(255,255,255,.055);
    --fill:rgba(255,255,255,.028); --fill2:rgba(255,255,255,.045);
    --sleep:90,110,170; --focus:90,140,150; --warm:210,150,95; --cool:110,150,210;
    --mono:ui-monospace,"SF Mono",Menlo,"Roboto Mono",monospace;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(var(--glow),.10), transparent 60%),
      radial-gradient(900px 600px at 92% 112%, rgba(var(--focus),.05), transparent 60%),
      var(--bg); }
  ::selection{ background:rgba(var(--glow),.32); color:#fff; }
  :focus-visible{ outline:1.5px solid rgba(var(--glow),.9); outline-offset:2px; border-radius:3px; }
  .wrap{ max-width:960px; margin:0 auto; padding:clamp(20px,3vw,40px) clamp(16px,3vw,26px) 70px; }
  h1{ font-size:clamp(1.3rem,2.2vw,1.7rem); font-weight:300; letter-spacing:.1em; margin:0 0 5px; }
  .sub{ color:var(--dim); font-size:12.5px; font-weight:300; margin-bottom:16px; line-height:1.6; }
  /* 顶栏 */
  .topbar{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .topbar a.back{ color:var(--faint); text-decoration:none; font-size:12.5px; border:1px solid var(--line); border-radius:999px; padding:4px 12px; transition:.2s; }
  .topbar a.back:hover{ color:var(--ink); border-color:rgba(var(--glow),.5); }
  .topbar .where{ color:var(--faint); font-size:.56rem; letter-spacing:.22em; text-transform:uppercase; margin-left:auto; }
  .langbar{ display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .langbar button{ background:transparent; color:var(--dim); border:0; padding:5px 12px; font-size:.66rem; letter-spacing:.08em; cursor:pointer; transition:.2s; }
  .langbar button + button{ border-left:1px solid var(--line); }
  .langbar button.on{ background:rgba(var(--glow),.18); color:var(--ink); }
  /* 展品导览 */
  .exhibit{ background:linear-gradient(180deg,var(--fill2),var(--fill)); border:1px solid var(--line); border-radius:14px; padding:15px 18px; margin-bottom:16px; backdrop-filter:blur(3px); }
  .exhibit .lead{ font-size:15px; color:var(--ink); font-weight:400; margin:0; line-height:1.6; }
  .exhibit p{ margin:8px 0 0; font-size:12.5px; color:var(--dim); line-height:1.7; }
  .exhibit .go{ margin-top:11px; padding-top:11px; border-top:1px solid var(--line); font-size:12.5px; color:rgba(var(--glow),.95); }
  .exhibit .note{ margin-top:8px; font-size:10.5px; color:var(--faint); }
  .btns{ display:flex; gap:10px; margin:2px 0 14px; flex-wrap:wrap; align-items:center; }
  button{ background:rgba(var(--glow),.14); color:var(--ink); border:1px solid var(--line); padding:9px 18px; border-radius:999px; font:inherit; font-size:13px; letter-spacing:.02em; cursor:pointer; transition:background .25s,border-color .25s; }
  button:hover{ background:rgba(var(--glow),.22); border-color:rgba(var(--glow),.5); }
  button.ghost{ background:transparent; color:var(--dim); }
  button.ghost:hover{ color:var(--ink); }
  button.ghost.on{ background:rgba(var(--glow),.18); color:var(--ink); border-color:rgba(var(--glow),.45); }
  #phasewrap{ display:none; gap:6px; }
  #phasewrap button{ padding:7px 14px; font-size:12.5px; }
  select{ background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:12.5px; }
  .top{ display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap; }
  canvas{ background:linear-gradient(180deg,rgba(0,0,0,.34),rgba(0,0,0,.14)); border:1px solid var(--line); border-radius:12px; }
  .panel{ background:linear-gradient(180deg,var(--fill2),var(--fill)); border:1px solid var(--line); border-radius:14px; padding:17px 19px; flex:1; min-width:300px; backdrop-filter:blur(3px); }
  .row{ display:grid; grid-template-columns:92px 1fr 52px; align-items:center; gap:12px; margin:11px 0; }
  .row label{ color:var(--dim); font-size:12.5px; line-height:1.25; min-height:31px; }  /* 固定两行高:中英切换时面板高度不变 */
  .row label .en{ display:block; font-size:10px; color:var(--faint); letter-spacing:.03em; }
  .row output{ color:var(--ink); font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; font-size:12.5px; }
  input[type=range]{ -webkit-appearance:none; appearance:none; height:3px; background:rgba(255,255,255,.12); border-radius:3px; outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:15px; height:15px; border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#fff,rgba(var(--glow),.95) 70%); border:1.5px solid rgba(255,255,255,.85);
    box-shadow:0 0 12px 2px rgba(var(--glow),.4),0 2px 6px rgba(0,0,0,.5); cursor:pointer; }
  input[type=range]::-moz-range-thumb{ width:15px; height:15px; border-radius:50%; border:1.5px solid rgba(255,255,255,.85); background:rgba(var(--glow),.95); }
  input[type=range]:focus-visible{ outline:2px solid rgba(var(--glow),.9); outline-offset:6px; border-radius:4px; }
  .layers{ margin-top:16px; padding-top:13px; border-top:1px solid var(--line); }
  .layer{ display:grid; grid-template-columns:20px 26px 1fr 96px 34px; align-items:center; gap:10px; padding:8px 0; }
  .layer .val{ font-size:10px; color:var(--dim); font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; }
  .layer.ph{ opacity:.42; }
  .layer .role{ font-size:10px; text-align:center; border:1px solid var(--line); border-radius:4px; padding:0 3px; color:var(--faint); }
  .layer .nm{ font-size:12.5px; line-height:1.3; }
  .layer .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle; }
  .layer input[type=checkbox]{ accent-color:var(--accent); width:15px; height:15px; }
  .layer .pos{ color:var(--faint); font-size:10px; }
  .hint{ color:var(--faint); font-size:12px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); line-height:1.7; }
  .hint b{ color:var(--dim); font-weight:500; }
  .leg{ font-size:10px; color:var(--faint); margin-top:8px; line-height:1.6; }
  .leg .state{ display:block; margin-top:4px; }
  .leg .state.preview{ color:rgba(var(--glow),.9); opacity:.9; }
  body.lang-en .row label .en{ display:none; }   /* EN 模式下主标签已是英文,隐藏重复副标 */
  @media (max-width:720px){
    .wrap{ padding:18px 14px 50px; }
    .top{ gap:16px; }
    .panel{ min-width:0; width:100%; }
    canvas#radar{ width:100%; height:auto; max-width:340px; }
    .layer{ grid-template-columns:20px 24px 1fr 70px 30px; gap:7px; }
  }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..500,50&family=Noto+Serif+SC:wght@300;400;500&display=swap">
<style>/* 标题字体统一:Fraunces + 思源宋体(与主站一致)*/ h1, h2, .brand, .ntitle { font-family: "Fraunces", "Noto Serif SC", Georgia, serif !important; font-variation-settings: "SOFT" 50; letter-spacing: -.01em !important; }</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← Sound States</a>
    <span class="where">Process · Engine</span>
    <span class="langbar">
      <button id="lang_en" type="button">EN</button>
      <button id="lang_zh" type="button" class="on">中</button>
    </span>
  </div>

  <h1 id="h1">场景合成台 · 空间调配</h1>
  <div class="sub" id="sub">戴耳机。程序化声景引擎的调配台：所有声音由代码实时合成，并按心理声学摆进一个空间。</div>

  <!-- 展品导览:导师第一次打开要能看懂这是什么 / exhibit header -->
  <div class="exhibit">
    <p class="lead" id="exLead"></p>
    <p class="go" id="exGo"></p>
    <p class="note" id="exNote"></p>
  </div>

  <div class="btns">
    <span class="mini" style="color:var(--dim);font-size:12.5px;" id="lab_scene">场景族</span>
    <select id="scene"></select>
    <span id="phasewrap"><button id="ph_day" class="ghost">白天</button><button id="ph_night" class="ghost">黑夜</button></span>
    <button id="play">▶ 开始</button>
    <button id="stop" class="ghost">停止</button>
    <span id="state" style="color:var(--dim);font-size:12.5px;">未播放</span>
  </div>
  <div class="btns">
    <button id="p_sleep" class="ghost">睡眠 · 下行弧</button>
    <button id="p_work" class="ghost">工作 · 平台</button>
    <span id="arc" style="color:var(--dim);font-size:12.5px;align-self:center;"></span>
  </div>
  <div class="btns">
    <span style="color:var(--dim);font-size:12.5px;align-self:center;" id="lab_hr">模拟心率</span>
    <select id="hrmode">
      <option value="off">关（用上面的预设按钮）</option>
      <option value="sleep">模拟 · 睡眠（缓降）</option>
      <option value="work">模拟 · 工作（稳 + 波动）</option>
      <option value="manual">手动滑块</option>
    </select>
    <input id="hrman" type="range" min="40" max="100" step="1" value="70" style="width:120px;" aria-label="manual heart rate">
    <span id="hrbpm" style="color:var(--accent);font-size:13px;align-self:center;font-variant-numeric:tabular-nums;">— BPM</span>
  </div>

  <div class="top">
    <div>
      <canvas id="radar" width="300" height="300" role="img" aria-label="Spatial map: you at the centre, sound layers placed by azimuth and distance"></canvas>
      <div class="leg" id="leg">
        <span id="legTxt">中心=你 · ● 常驻/连续 · ○ 逐事件（方位散布） · 虚线大圈=底胶弥漫</span>
        <span class="state" id="radarState"></span>
      </div>
    </div>

    <div class="panel">
      <div class="row"><label><span id="l_radius">弥散半径</span><span class="en">Diffusion radius</span></label><input id="radius" type="range" min="0.5" max="2.6" step="0.05" value="1.3"><output id="radius_o"></output></div>
      <div class="row"><label><span id="l_reverb">弥散混响</span><span class="en">Diffuse reverb</span></label><input id="reverb" type="range" min="0" max="1.5" step="0.01" value="0.9"><output id="reverb_o"></output></div>
      <div class="row"><label><span id="l_tone">暖 ↔ 冷</span><span class="en">Warm ↔ Cool</span></label><input id="tone" type="range" min="1800" max="16000" step="100" value="7000"><output id="tone_o"></output></div>
      <div class="row"><label><span id="l_vol">总音量</span><span class="en">Master</span></label><input id="vol" type="range" min="0" max="1" step="0.01" value="0.85"><output id="vol_o"></output></div>
      <div class="row"><label><span id="l_glue">融合 glue</span><span class="en">Fusion bus</span></label><input id="glue" type="range" min="0" max="1" step="0.01" value="0.9"><output id="glue_o">0.90</output></div>

      <div class="layers" id="layers"></div>

      <div class="hint" id="hint">
        · <b>K</b>=一直在（背景，会习惯化退隐） · <b>S</b>=随机触发（前景，抢注意，放前方） · <b>M</b>=中间（密度决定）<br>
        · <b>融合 glue</b>=总线压缩把各层黏成一体（0=关）；<b>弥散混响</b>=共同房间尾巴<br>
        · 每层右侧数字=当前音量比率；带区间的层会在区间内缓慢呼吸（渐强渐弱）
      </div>
    </div>
  </div>
</div>

<script src="sound-engines.js"></script>
<script src="scene-config.js"></script>
<script src="scene-engine.js"></script>
<script>
// 调音台是开发工具,别被主站 PWA 的 service worker 缓存/拦截(会导致 fetch 素材失败)。
// 若本页被 SW 控制→注销全部并自动重载一次,之后无 SW 干净运行。
if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
  navigator.serviceWorker.getRegistrations()
    .then(rs => Promise.all(rs.map(r => r.unregister())))
    .then(() => location.reload());
}
const $ = id => document.getElementById(id);
// 数值格式化。tone/glue 带文字,必须跟语言走 —— 之前写死中文,英文界面会蹦出「中」「关」。
const GFMT={ radius:v=>(+v).toFixed(2)+'×', reverb:v=>(+v).toFixed(2), vol:v=>(+v).toFixed(2),
             tone:v=>(lang==='en' ? (+v>=11000?'cool':+v<4000?'warm':'neutral')
                                  : (+v>=11000?'冷':+v<4000?'暖':'中'))+' '+v,
             glue:v=>(+v<=0 ? (lang==='en'?'off':'关') : (+v).toFixed(2)) };
let raf=0;
const clock=a=>{ const h=((Math.round(a/(Math.PI/6))+12)%12)||12; return h+(lang==='en'?' o\'clock':'点'); };

/* ============================ 双语 / i18n ============================ */
const EN_LAYER = { 'glue':'Base bed','wind':'Wind','drip':'Eave drip','bell':'Temple bell','woodfish':'Wooden fish',
  'ai:rainbed':'Rain bed (surround)','ai:thunder':'Far thunder','ai:rainwin':'Rain outside window','ai:raindrip':'Rain drips (muffled)',
  'ai:keyboard':'Keyboard','ai:pen':'Pen','ai:paper':'Paper','ai:mouse':'Mouse','ai:chair':'Chair',
  'ai:wave':'Waves','ai:gull':'Gulls (far)','ai:fire':'Campfire','ai:insect':'Crickets','ai:stream':'Stream',
  'ai:owl':'Owl (far)','ai:bird':'Birdsong' };
const EN_SCENE = { hills:'Mountain (temple + forest · day/night)', rain:'Rain · by the window',
  homework:'Rainy home office (work)', beach:'Empty sea (work / focus)' };

const I18N = {
  h1:      { zh:'场景合成台 · 空间调配', en:'Spatial Composer' },
  sub:     { zh:'戴耳机。程序化声景引擎的调配台：所有声音由代码实时合成，并按心理声学摆进一个空间。',
             en:'Headphones recommended. The mixing desk for the generative soundscape engine: every sound is synthesised live in code and placed in a space by psychoacoustic rules.' },
  exLead:  { zh:'Sound States「工作 / 睡眠」板块的声音生产端。',
             en:'The sound-production end of the Work / Sleep boards in Sound States.' },
  exGo:    { zh:'建议路径：① 选一个场景 → ② 按「开始」 → ③ 拖「弥散半径」，听空间怎么变。',
             en:'Suggested path: ① pick a scene → ② press Start → ③ drag "Diffusion radius" and hear the space change.' },
  exNote:  { zh:'引擎 scene-engine.js · 配置 scene-config.js（与主站板块共用同一份，一处调、处处生效）。',
             en:'Engine: scene-engine.js · Config: scene-config.js (shared with the main site — change once, applies everywhere).' },
  lab_scene:{ zh:'场景族', en:'Scene' },
  lab_hr:  { zh:'模拟心率', en:'Simulated heart rate' },
  l_radius:{ zh:'弥散半径', en:'Diffusion radius' },
  l_reverb:{ zh:'弥散混响', en:'Diffuse reverb' },
  l_tone:  { zh:'暖 ↔ 冷', en:'Warm ↔ Cool' },
  l_vol:   { zh:'总音量', en:'Master' },
  l_glue:  { zh:'融合 glue', en:'Fusion bus' },
  legTxt:  { zh:'中心=你 · 同心圆=距离 · 实心点=一直在响的 · 空心点=偶尔响一下的 · 最外大圈=底胶（没有方位）',
             en:'Centre = you · rings = distance · filled = always sounding · hollow = occasional sounds · outer ring = ambient bed (no direction)' },
  statePreview:{ zh:'未播放 — 这是本场景的空间蓝图，按「开始」让它动起来。',
             en:'Not playing — this is the scene\'s spatial blueprint. Press Start to bring it to life.' },
  stateLive:{ zh:'播放中 — 点正在随事件漂移。', en:'Playing — dots are drifting with each event.' },
  hint:    { zh:'· <b>K</b>=一直在（背景，会习惯化退隐） · <b>S</b>=随机触发（前景，抢注意，放前方） · <b>M</b>=中间（密度决定）<br>· <b>融合 glue</b>=总线压缩把各层黏成一体（0=关）；<b>弥散混响</b>=共同房间尾巴<br>· 每层右侧数字=当前音量比率；带区间的层会在区间内缓慢呼吸（渐强渐弱）',
             en:'· <b>K</b> = always present (habituates) · <b>S</b> = random trigger · <b>M</b> = in between<br>· <b>Fusion bus</b> = glues the layers into one · <b>Diffuse reverb</b> = a shared room tail<br>· Right number = current level · layers with a range breathe slowly' },
  btnPlay: { zh:'▶ 开始', en:'▶ Start' },
  btnStop: { zh:'停止', en:'Stop' },
  phDay:   { zh:'白天', en:'Day' },
  phNight: { zh:'黑夜', en:'Night' },
  pSleep:  { zh:'睡眠 · 下行弧', en:'Sleep · descending arc' },
  pWork:   { zh:'工作 · 平台', en:'Work · plateau' },
  hrOff:   { zh:'关（用上面的预设按钮）', en:'Off (use the preset buttons above)' },
  hrSleep: { zh:'模拟 · 睡眠（缓降）', en:'Simulated · sleep (slow descent)' },
  hrWork:  { zh:'模拟 · 工作（稳 + 波动）', en:'Simulated · work (steady + fluctuation)' },
  hrManual:{ zh:'手动滑块', en:'Manual slider' },
  stIdle:  { zh:'未播放', en:'Stopped' },
  stPlaying:{ zh:'播放中', en:'Playing' },
  stLoading:{ zh:'加载中…', en:'Loading…' },
};
let lang = localStorage.getItem('ss_lang') || 'zh';
const T = k => (I18N[k] ? (I18N[k][lang] || I18N[k].zh) : k);
function applyLang(next){
  lang = next || lang;
  try{ localStorage.setItem('ss_lang', lang); }catch(e){}
  document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hans';
  document.body.classList.toggle('lang-en', lang === 'en');
  document.title = (lang === 'en' ? 'Spatial Composer' : '场景合成台 · 空间调配') + ' — Sound States · Process';
  for (const k in I18N){ const el = $(k); if (el) el.innerHTML = T(k); }
  $('lang_en').classList.toggle('on', lang==='en');
  $('lang_zh').classList.toggle('on', lang==='zh');
  // 旋钮的数值文字(暖冷/glue)跟语言走,切语言要重画一遍
  ['radius','reverb','tone','vol','glue'].forEach(id=>{
    const el=$(id), o=$(id+'_o'); if(el && o && GFMT[id]) o.textContent = GFMT[id](+el.value);
  });
  // 下拉/按钮上非 i18n 键的文案
  const setTxt=(id,k)=>{ const e=$(id); if(e) e.textContent = T(k); };
  $('hrmode').options[0].textContent = T('hrOff');
  $('hrmode').options[1].textContent = T('hrSleep');
  $('hrmode').options[2].textContent = T('hrWork');
  $('hrmode').options[3].textContent = T('hrManual');
  buildSceneSelect();
  buildLayerUI();
  updatePhaseUI();
  refreshRadar();
  $('play').textContent = T('btnPlay');
  $('stop').textContent = T('btnStop');
  $('p_sleep').textContent = T('pSleep');
  $('p_work').textContent = T('pWork');
  $('ph_day').textContent = T('phDay');
  $('ph_night').textContent = T('phNight');
  if (!eng.isRunning()) $('state').textContent = T('stIdle');
}
const layerName = L => lang==='en' ? (EN_LAYER[L.key] || L.label) : L.label;
// 雷达上的标签只取主名 —— 括号里的说明(持续·暖包裹 / (far))在右侧图层列表里写,
// 挤在图上只会挡住别的点。
const shortName = s => String(s).replace(/[（(][^）)]*[）)]/g,'').trim();

// 引擎持有音频;控制台只做 UI,通过回调回显
const eng = createSceneEngine(SoundscapeConfig, {
  onState:t=>$('state').textContent = (t===T('stPlaying')||t==='播放中') ? T('stPlaying') : (t==='加载中…'?T('stLoading'):t),
  onArc:t=>$('arc').textContent=t,
  onHR:hr=>$('hrbpm').textContent=Math.round(hr)+' BPM',
  onLayerVol:(L,v)=>{ if(L._volInput)L._volInput.value=v; if(L._volOut)L._volOut.textContent=(+v).toFixed(2); },
  onParam:(id,v)=>{ const el=$(id); if(el)el.value=v; const o=$(id+'_o'); if(o&&GFMT[id])o.textContent=GFMT[id](v); },
  onStart:()=>{ cancelAnimationFrame(raf); drawRadar(); },   // start/restart 后(重)启雷达
});
const SCENES = eng.SCENES;   // 同一份引用,供 UI 遍历

// ---- 全局旋钮滑块 ----
function bindGlobal(){ ['radius','reverb','tone','vol','glue'].forEach(id=>{
  const el=$(id); el.addEventListener('input',()=>{ eng.setParam(id,+el.value);
    if(id==='radius' && !eng.isRunning()) refreshRadar(); });   // 未播放时半径也要反映到蓝图
  $(id+'_o').textContent=GFMT[id](+el.value); eng.setParam(id,+el.value);   // 初始同步进引擎
}); }

// ---- 环山·白天/黑夜 ----
function setActivePhaseBtn(){ $('ph_day').classList.toggle('on',eng.getPhase()==='day'); $('ph_night').classList.toggle('on',eng.getPhase()==='night'); }
function updatePhaseUI(){ $('phasewrap').style.display = eng.isPhased()?'inline-flex':'none'; if(eng.isPhased()) setActivePhaseBtn(); }
function setPhase(p){ if(!eng.isPhased()||p===eng.getPhase()) return; eng.setPhase(p); setActivePhaseBtn(); buildLayerUI(); refreshRadar(); eng.restart(); }

// ---- 场景选择 ----
function buildSceneSelect(){ const sel=$('scene'); const cur=eng.getScene(); sel.innerHTML='';
  Object.keys(SCENES).forEach(k=>{ const o=document.createElement('option'); o.value=k;
    o.textContent = lang==='en' ? (EN_SCENE[k] || SCENES[k].label) : SCENES[k].label;
    if(k===cur)o.selected=true; sel.appendChild(o); });
  if(!sel._bound){ sel.addEventListener('change',()=>{ eng.setScene(sel.value); updatePhaseUI(); buildLayerUI(); refreshRadar(); eng.restart(); }); sel._bound=true; }
}

// ---- 图层列表 ----
function layerPosText(L){
  if(lang==='en'){
    if(L.ambient) return 'ambient bed';
    if(L.placeholder) return 'not connected';
    if(L.kind==='bed') return 'surround · bed';
    if(L.perEvent||L.kind==='evt') return 'near '+clock(L.ang)+' · per-event';
    return clock(L.ang)+' · '+(L.dist>=1.8?'far':L.dist<=1?'near':'mid');
  }
  return L.ambient?'弥漫' : L.placeholder?'待接' : L.kind==='bed'?'环绕·bed' :
    (L.perEvent||L.kind==='evt')?(clock(L.ang)+'附近·逐事件') : (clock(L.ang)+' · '+(L.dist>=1.8?'远':L.dist<=1?'近':'中'));
}
function buildLayerUI(){ const box=$('layers'); box.innerHTML='';
  eng.getLayers().forEach(L=>{
    const row=document.createElement('div'); row.className='layer'+(L.placeholder?' ph':'');
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=L._on; cb.disabled=!!L.placeholder;
    cb.setAttribute('aria-label', layerName(L));
    cb.addEventListener('change',()=>{ L._on=cb.checked; refreshRadar(); eng.restart(); });
    const role=document.createElement('div'); role.className='role'; role.textContent=L.role;
    const nm=document.createElement('div'); nm.className='nm';
    nm.innerHTML='<span class="dot" style="background:'+L.color+'"></span>'+layerName(L)+' <span class="pos">'+layerPosText(L)+'</span>';
    const vol=document.createElement('input'); vol.type='range'; vol.min=0; vol.max=1; vol.step=0.01; vol.value=L._vol; vol.disabled=!!L.placeholder;
    vol.setAttribute('aria-label', layerName(L)+' level');
    const val=document.createElement('div'); val.className='val'; val.textContent=(+L._vol).toFixed(2);
    L._volInput=vol; L._volOut=val;
    vol.addEventListener('input',()=>{ val.textContent=(+vol.value).toFixed(2); eng.setLayerVol(L,+vol.value); });
    row.appendChild(cb); row.appendChild(role); row.appendChild(nm); row.appendChild(vol); row.appendChild(val);
    box.appendChild(row);
  });
}

/* ---- 雷达:统一绘制。live=引擎 runtime 驱动;static=按配置画空间蓝图 ----
   高分屏:内部分辨率按 devicePixelRatio 走,显示尺寸不变 → Retina 上不再糊。 ---- */
const RADAR_S = 420;                        // 逻辑尺寸(CSS 像素)
const RADAR_K = RADAR_S / 300;              // 等比系数:圆环/坐标/字都按它放大,比例才不变
const R_MAIN = RADAR_S*0.44;                 // main range ring
const R_OUT  = RADAR_S*0.485;                // ambient-bed dashed ring
function ambientRing(g,cx,cy,color,alpha){
  g.save(); g.globalAlpha=alpha; g.shadowColor=color; g.shadowBlur=8;
  g.setLineDash([2,8]); g.strokeStyle=color; g.lineWidth=1.6;
  g.beginPath(); g.arc(cx,cy,R_OUT,0,7); g.stroke(); g.restore();
}
function radarFrame(){
  const cv=$('radar');
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  if (cv.width !== RADAR_S*dpr || cv.height !== RADAR_S*dpr){
    cv.width = RADAR_S*dpr; cv.height = RADAR_S*dpr;
    cv.style.width = RADAR_S+'px'; cv.style.height = RADAR_S+'px';
  }
  const g = cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  const W=RADAR_S, H=RADAR_S, cx=W/2, cy=H/2;
  g.clearRect(0,0,W,H);

  // soft disc glow
  const halo=g.createRadialGradient(cx,cy,0,cx,cy,R_OUT+14);
  halo.addColorStop(0,'rgba(26,29,40,.85)'); halo.addColorStop(.7,'rgba(16,19,27,.4)'); halo.addColorStop(1,'rgba(10,12,18,0)');
  g.fillStyle=halo; g.beginPath();g.arc(cx,cy,R_OUT+14,0,7);g.fill();

  // radar sweep wedge + leading edge
  (function(){
    const lead=-0.62, width=0.62;
    g.save(); g.beginPath(); g.moveTo(cx,cy); g.arc(cx,cy,R_MAIN,lead-width,lead); g.closePath(); g.clip();
    const sw=g.createRadialGradient(cx,cy,0,cx,cy,R_MAIN);
    sw.addColorStop(0,'rgba(120,150,205,.15)'); sw.addColorStop(.7,'rgba(100,125,185,.05)'); sw.addColorStop(1,'rgba(90,110,170,0)');
    g.fillStyle=sw; g.fillRect(0,0,W,H); g.restore();
    const gx=g.createLinearGradient(cx,cy,cx+Math.cos(lead)*R_MAIN,cy+Math.sin(lead)*R_MAIN);
    gx.addColorStop(0,'rgba(150,175,225,0)'); gx.addColorStop(1,'rgba(150,175,225,.3)');
    g.strokeStyle=gx; g.lineWidth=1.4; g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(lead)*R_MAIN,cy+Math.sin(lead)*R_MAIN);g.stroke();
  })();

  // azimuth spokes
  g.strokeStyle='rgba(255,255,255,.035)'; g.lineWidth=1;
  for(let i=0;i<12;i++){ const a=i/12*Math.PI*2;
    g.beginPath(); g.moveTo(cx+Math.cos(a)*R_MAIN*0.14, cy+Math.sin(a)*R_MAIN*0.14); g.lineTo(cx+Math.cos(a)*R_MAIN, cy+Math.sin(a)*R_MAIN); g.stroke(); }

  // range rings
  function ring(r,dash,color,lw){
    const grd=g.createRadialGradient(cx,cy,r-3,cx,cy,r+3);
    grd.addColorStop(0,'rgba('+color+',0)'); grd.addColorStop(.5,'rgba('+color+',.8)'); grd.addColorStop(1,'rgba('+color+',0)');
    g.strokeStyle=grd; g.lineWidth=lw||2; if(dash)g.setLineDash(dash);
    g.beginPath(); g.arc(cx,cy,r,0,7); g.stroke(); g.setLineDash([]);
  }
  g.strokeStyle='rgba(255,255,255,.05)'; g.lineWidth=1;
  [0.42,0.72].forEach(f=>{g.beginPath();g.arc(cx,cy,R_MAIN*f,0,7);g.stroke();});
  ring(R_MAIN,false,'140,170,220',2);

  // azimuth compass FRONT / REAR / LEFT / RIGHT (in the ring gap)
  (function(){
    const rc=(R_MAIN+R_OUT)/2, col='rgba(150,160,182,.55)';
    const caps=(str)=>str.split('').join(' ');
    const ink=(str,x,y)=>{ g.save(); g.lineJoin='round'; g.strokeStyle='rgba(9,11,16,.9)'; g.lineWidth=2.4; g.strokeText(str,x,y); g.fillStyle=col; g.fillText(str,x,y); g.restore(); };
    g.font='500 10px -apple-system,"PingFang SC",system-ui,sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    ink(caps(lang==='en'?'FRONT':'前'),cx,cy-rc);
    ink(caps(lang==='en'?'REAR':'后'), cx,cy+rc);
    ink(caps(lang==='en'?'LEFT':'左'), cx-rc,cy);
    ink(caps(lang==='en'?'RIGHT':'右'),cx+rc,cy);
    g.textBaseline='alphabetic'; g.textAlign='start';
  })();

  // centre: listener head (facing FRONT) + pulse ring
  g.strokeStyle='rgba(150,165,190,.16)'; g.lineWidth=1; g.beginPath();g.arc(cx,cy,15,0,7);g.stroke();
  const you=g.createRadialGradient(cx,cy,0,cx,cy,24);
  you.addColorStop(0,'rgba(150,165,190,.5)'); you.addColorStop(.5,'rgba(120,140,180,.25)'); you.addColorStop(1,'rgba(90,110,170,0)');
  g.fillStyle=you; g.beginPath();g.arc(cx,cy,24,0,7);g.fill();
  g.save(); g.translate(cx,cy);
  g.shadowColor='rgba(150,165,190,.7)'; g.shadowBlur=8;
  g.fillStyle='rgba(214,210,200,.92)';
  g.beginPath();g.ellipse(-6.2,0,1.7,3,0,0,7);g.fill();
  g.beginPath();g.ellipse(6.2,0,1.7,3,0,0,7);g.fill();
  g.shadowBlur=0;
  g.fillStyle='rgba(18,21,29,.96)'; g.beginPath();g.arc(0,0,6,0,7);g.fill();
  g.lineWidth=1.3; g.strokeStyle='rgba(233,229,220,.9)'; g.stroke();
  g.fillStyle='rgba(233,229,220,.9)'; g.beginPath();g.moveTo(0,-6.2);g.lineTo(-2.2,-3.3);g.lineTo(2.2,-3.3);g.closePath();g.fill();
  g.restore();
  g.fillStyle='rgba(233,229,220,.6)'; g.font='500 12px -apple-system,"PingFang SC",system-ui,sans-serif'; g.textAlign='center';
  g.fillText(lang==='en'?'you':'你', cx, cy+34); g.textAlign='start';

  return { g, cx, cy, R:eng.getParam('radius'), scale:42*RADAR_K };
}
function drawLayerDot(g,cx,cy,R,scale,L,ang,dist,alpha,hollow,showLabel){
  const x=cx+Math.sin(ang)*R*dist*scale, y=cy-Math.cos(ang)*R*dist*scale;
  const a=alpha*Math.max(0.4,1-(R*dist)/3.4);
  const color=L.color||'#96a5be';
  g.save();
  g.globalAlpha=a*0.20; g.fillStyle=color;
  g.beginPath(); g.arc(x,y,(hollow?7:7.5)*2.3,0,7); g.fill();
  g.globalAlpha=a; g.shadowColor=color; g.shadowBlur=12;
  if(hollow){
    g.strokeStyle=color; g.lineWidth=2.4; g.beginPath();g.arc(x,y,7,0,7);g.stroke();
    g.shadowBlur=0; g.fillStyle=color; g.globalAlpha=a*0.9; g.beginPath();g.arc(x,y,1.6,0,7);g.fill();
  } else {
    g.fillStyle=color; g.beginPath();g.arc(x,y,6.6,0,7);g.fill();
    g.shadowBlur=0; g.fillStyle='#fff'; g.globalAlpha=a; g.beginPath();g.arc(x,y,2,0,7);g.fill();
  }
  g.restore();
  if(showLabel!==false){
    const lab=shortName(layerName(L));
    g.save(); g.globalAlpha=Math.max(alpha,.85);
    g.font='500 12px -apple-system,"PingFang SC",system-ui,sans-serif';
    g.lineJoin='round'; g.strokeStyle='rgba(9,11,16,.9)'; g.lineWidth=3; g.strokeText(lab, x+13, y+4);
    g.fillStyle='#c7cfdb'; g.fillText(lab, x+13, y+4);
    g.restore();
  }
}
// 静态空间蓝图:读配置,不依赖引擎是否在跑
function drawRadarStatic(){
  const { g, cx, cy, R, scale } = radarFrame();
  (eng.getLayers()||[]).forEach(L=>{
    const on = L._on !== false, alpha = on ? 1 : 0.3;
    if(L.ambient){ ambientRing(g,cx,cy,L.color, on?0.5:0.2); return; }
    if(L.placeholder) return;
    const hollow = !!(L.perEvent || L.kind==='evt');
    // 每层只画一个点、标一次名 —— 多个位置不连线
    if(L.pos && L.pos.length){ const p=L.pos[0]; drawLayerDot(g,cx,cy,R,scale,L,p.ang,p.dist,alpha,hollow,true); }
    else if(typeof L.ang === 'number') drawLayerDot(g,cx,cy,R,scale,L,L.ang,L.dist||1,alpha,hollow);
  });
  const st=$('radarState'); st.textContent=T('statePreview'); st.className='state preview';
}
// 实时雷达:读引擎 runtime
function drawRadar(){
  const { g, cx, cy, R, scale } = radarFrame();
  eng.getRuntime().forEach(r=>{
    const L=r.L;
    if(L.ambient){ ambientRing(g,cx,cy,L.color,0.5); return; }
    if(r.panners){ const p=r.panners[0]; drawLayerDot(g,cx,cy,R,scale,L,p._ang,p._dist,1,false,true); return; }
    drawLayerDot(g,cx,cy,R,scale,L,L.ang,L.dist,1,!!(L.perEvent||L.kind==='evt'));
  });
  const st=$('radarState'); st.textContent=T('stateLive'); st.className='state';
  if(eng.isRunning()) raf=requestAnimationFrame(drawRadar);
}
function refreshRadar(){ if(!eng.isRunning()) drawRadarStatic(); }

// ---- 控制 ----
$('play').onclick=()=>eng.ensureRunning();
$('stop').onclick=()=>{ eng.stopArc(); eng.stopHR(); $('arc').textContent=''; $('hrbpm').textContent='— BPM'; eng.stop(); cancelAnimationFrame(raf); refreshRadar(); };
$('p_sleep').onclick=async()=>{ eng.stopHR(); $('hrmode').value='off'; await eng.ensureRunning(); eng.applySleep(); };
$('p_work').onclick=async()=>{ eng.stopHR(); $('hrmode').value='off'; await eng.ensureRunning(); eng.applyWork(); };
$('hrmode').addEventListener('change',async()=>{ const m=$('hrmode').value;
  if(m==='off'){ eng.stopHR(); $('hrbpm').textContent='— BPM'; return; }
  await eng.ensureRunning(); eng.startHR(m, ()=>+$('hrman').value); });
$('hrman').addEventListener('input',()=>{ if($('hrmode').value!=='manual'){ $('hrmode').value='manual'; if(eng.isRunning()) eng.startHR('manual', ()=>+$('hrman').value); } });
$('ph_day').onclick=()=>setPhase('day');
$('ph_night').onclick=()=>setPhase('night');
$('lang_en').onclick=()=>applyLang('en');
$('lang_zh').onclick=()=>applyLang('zh');

buildSceneSelect(); updatePhaseUI(); buildLayerUI(); bindGlobal(); applyLang(lang); refreshRadar();
</script>
<script src="ui-icons.js"></script>
</body>
